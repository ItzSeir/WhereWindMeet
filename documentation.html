  <script>
    /* =========================================================
       ONLY CHANGE THIS CONFIG
       ========================================================= */
    const DOCS_CONFIG = {
      // GitHub account name
      owner: "ItzSeir",

      // Repository name, for example: ItzSeir or WhereWindMeet
      repo: "WhereWindMeet",

      // Branch name
      branch: "main",

      // Folder containing all .md files
      folder: "data/wherewindmeet-docs",

      // Open this file first. Leave empty to open the first file.
      defaultFile: "01-start.md"
    };

    /* =========================================================
       APPLICATION
       ========================================================= */
    const state = {
      files: [],
      documents: new Map(),
      activeFile: "",
      metadata: new Map()
    };

    const el = {
      docList: document.getElementById("docList"),
      statusBox: document.getElementById("statusBox"),
      markdownBody: document.getElementById("markdownBody"),
      docTitle: document.getElementById("docTitle"),
      docFile: document.getElementById("docFile"),
      docBadges: document.getElementById("docBadges"),
      docDescription: document.getElementById("docDescription"),
      docMetaPanel: document.getElementById("docMetaPanel"),
      breadcrumbName: document.getElementById("breadcrumbName"),
      tocList: document.getElementById("tocList"),
      searchInput: document.getElementById("searchInput"),
      searchResults: document.getElementById("searchResults"),
      sidebar: document.getElementById("sidebar"),
      mobileMenuBtn: document.getElementById("mobileMenuBtn"),
      sidebarBackdrop: document.getElementById("sidebarBackdrop"),
      themeToggle: document.getElementById("siteThemeToggleBtn"),
      content: document.querySelector(".content")
    };

    marked.setOptions({
      gfm: true,
      breaks: false,
      headerIds: false,
      mangle: false
    });

    // Chinese labels such as **團類型：**普通團 are intended as bold.
    // Extend inline tokenization only; code blocks and HTML stay untouched.
    marked.use({ extensions: [{
      name: "cjkLabelStrong",
      level: "inline",
      start(src){ return src.indexOf("**"); },
      tokenizer(src){
        const match = /^\*\*([^*\n]+[：:，。、；！？])\*\*(?=[\p{L}\p{N}])/u.exec(src);
        if(!match || !/\p{Script=Han}/u.test(match[1])) return;
        return { type:"cjkLabelStrong", raw:match[0], tokens:this.lexer.inlineTokens(match[1]) };
      },
      renderer(token){ return `<strong>${this.parser.parseInline(token.tokens)}</strong>`; }
    }] });

    function apiFolderUrl(){
      const path = DOCS_CONFIG.folder
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      return `https://api.github.com/repos/${encodeURIComponent(DOCS_CONFIG.owner)}/${encodeURIComponent(DOCS_CONFIG.repo)}/contents/${path}?ref=${encodeURIComponent(DOCS_CONFIG.branch)}`;
    }

    function cleanFilename(filename){
      return filename
        .replace(/\.md$/i, "")
        .replace(/^\d+[-_. ]*/, "")
        .replace(/[-_]+/g, " ")
        .trim();
    }

    function titleFromMarkdown(markdown, fallback){
      const match = markdown.match(/^#\s+(.+)$/m);
      return match ? match[1].trim() : cleanFilename(fallback);
    }


    function parseScalar(value){
      const trimmed = String(value ?? "").trim();
      if(!trimmed) return "";
      if(/^true$/i.test(trimmed)) return true;
      if(/^false$/i.test(trimmed)) return false;
      if(/^null$/i.test(trimmed)) return null;
      if(/^[-+]?\d+(\.\d+)?$/.test(trimmed)) return Number(trimmed);
      if((trimmed.startsWith('"') && trimmed.endsWith('"')) || (trimmed.startsWith("'") && trimmed.endsWith("'"))){
        return trimmed.slice(1,-1);
      }
      if(trimmed.startsWith("[") && trimmed.endsWith("]")){
        return trimmed.slice(1,-1).split(",").map(item => parseScalar(item)).filter(Boolean);
      }
      return trimmed;
    }

    function parseFrontMatter(markdown, filename){
      const normalized = markdown.replace(/^\uFEFF/, "");
      const match = normalized.match(/^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n|$)/);
      const meta = {};
      let body = normalized;
      if(match){
        body = normalized.slice(match[0].length);
        const lines = match[1].split(/\r?\n/);
        let currentKey = "";
        for(const rawLine of lines){
          if(!rawLine.trim() || /^\s*#/.test(rawLine)) continue;
          const listMatch = rawLine.match(/^\s*-\s+(.+)$/);
          if(listMatch && currentKey){
            if(!Array.isArray(meta[currentKey])) meta[currentKey] = meta[currentKey] ? [meta[currentKey]] : [];
            meta[currentKey].push(parseScalar(listMatch[1]));
            continue;
          }
          const keyMatch = rawLine.match(/^([A-Za-z][\w-]*):\s*(.*)$/);
          if(!keyMatch) continue;
          currentKey = keyMatch[1];
          meta[currentKey] = keyMatch[2] === "" ? [] : parseScalar(keyMatch[2]);
        }
      }
      meta.title = meta.title || titleFromMarkdown(body, filename);
      meta.icon = meta.icon || "▤";
      meta.category = meta.category || "其他";
      meta.tags = Array.isArray(meta.tags) ? meta.tags : (meta.tags ? [meta.tags] : []);
      meta.aliases = Array.isArray(meta.aliases) ? meta.aliases : (meta.aliases ? [meta.aliases] : []);
      meta.pills = Array.isArray(meta.pills) ? meta.pills : (meta.pills ? [meta.pills] : []);
      if(meta.pill) meta.pills.unshift(meta.pill);
      meta.order = Number.isFinite(Number(meta.order)) ? Number(meta.order) : fileOrder(filename);
      return { meta, body };
    }

    function calculateReadingTime(text){
      const clean = text
        .replace(/^---[\s\S]*?---\s*/," ")
        .replace(/```[\s\S]*?```/g," ")
        .replace(/<[^>]+>/g," ")
        .replace(/https?:\/\/\S+/g," ");
      const cjk = (clean.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
      const latin = clean.replace(/[\u3400-\u9fff\uf900-\ufaff]/g," ").match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || [];
      return Math.max(1, Math.ceil(cjk / 400 + latin.length / 220));
    }

    function formatDateValue(value){
      if(!value) return "";
      const text = String(value).trim();
      const date = new Date(text.length === 10 ? `${text}T00:00:00` : text);
      if(Number.isNaN(date.getTime())) return text;
      return new Intl.DateTimeFormat("zh-Hant", {year:"numeric",month:"2-digit",day:"2-digit"}).format(date);
    }

    function normalizeColor(value){
      const allowed = ["blue","purple","green","gold","yellow","red","gray","cyan"];
      const color = String(value || "blue").toLowerCase();
      return allowed.includes(color) ? color : "blue";
    }

    function metadataFor(file){
      return state.metadata.get(file.name) || {title:cleanFilename(file.name),icon:"▤",category:"其他",tags:[],pinned:false,order:fileOrder(file.name)};
    }

    function fileOrder(name){
      const match = name.match(/^(\d+)/);
      return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
    }

    function slugify(text, index){
      const base = text
        .toLowerCase()
        .trim()
        .replace(/[^\p{L}\p{N}\s-]/gu, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");

      return base || `section-${index}`;
    }

    async function loadFolder(){
      try{
        el.statusBox.textContent = "正在從 GitHub 讀取文件資料夾…";

        const response = await fetch(apiFolderUrl(), {
          headers: { "Accept": "application/vnd.github+json" },
          cache: "no-store"
        });

        if(!response.ok){
          throw new Error(`GitHub API ${response.status}`);
        }

        const items = await response.json();

        state.files = items
          .filter(item => item.type === "file" && /\.md$/i.test(item.name))
          .sort((a,b) => {
            const orderDiff = fileOrder(a.name) - fileOrder(b.name);
            return orderDiff || a.name.localeCompare(b.name, "zh-Hant");
          });

        if(!state.files.length){
          throw new Error("資料夾內沒有找到 Markdown 文件");
        }

        await Promise.all(state.files.map(async file => {
          try{
            const markdown = await fetchMarkdown(file);
            const parsed = parseFrontMatter(markdown, file.name);
            parsed.meta.readingMinutes = calculateReadingTime(parsed.body);
            state.metadata.set(file.name, parsed.meta);
          }catch(error){
            console.warn("Metadata skipped:", file.name, error);
          }
        }));

        state.files = state.files.filter(file => {
          const meta = metadataFor(file);
          return !meta.hidden && !meta.draft;
        });

        state.files.sort((a,b) => {
          const ma = metadataFor(a);
          const mb = metadataFor(b);
          return Number(Boolean(mb.pinned)) - Number(Boolean(ma.pinned)) ||
                 Number(ma.order) - Number(mb.order) ||
                 a.name.localeCompare(b.name, "zh-Hant");
        });

        renderFileList();

        el.statusBox.textContent = `已找到 ${state.files.length} 篇文章，其中 ${state.files.filter(file => metadataFor(file).pinned).length} 篇置頂。`;

        const hashFile = decodeURIComponent(location.hash.replace(/^#doc=/, ""));
        const firstFile =
          state.files.find(file => file.name === hashFile) ||
          state.files.find(file => file.name === DOCS_CONFIG.defaultFile) ||
          state.files[0];

        await openDocument(firstFile.name, false);
      }catch(error){
        console.error(error);

        el.docList.innerHTML = `
          <div class="statusBox">
            無法載入文件列表。請檢查 owner、repo、branch 和 folder 設定。
          </div>
        `;

        el.markdownBody.innerHTML = `
          <div class="emptyState">
            <strong>文件載入失敗</strong>
            ${escapeHtml(error.message)}
          </div>
        `;

        el.statusBox.textContent = `錯誤：${error.message}`;
      }
    }

    function renderFileList(){
      el.docList.innerHTML = "";
      const pinned = state.files.filter(file => Boolean(metadataFor(file).pinned));
      const normal = state.files.filter(file => !Boolean(metadataFor(file).pinned));
      const groups = [];
      if(pinned.length) groups.push({title:"📌 置頂文章", files:pinned});
      const categories = new Map();
      normal.forEach(file => {
        const category = metadataFor(file).category || "其他";
        if(!categories.has(category)) categories.set(category, []);
        categories.get(category).push(file);
      });
      categories.forEach((files,title) => groups.push({title:`📂 ${title}`,files}));

      groups.forEach(group => {
        const section = document.createElement("section");
        section.className = "sidebarSection";
        const heading = document.createElement("div");
        heading.className = "sidebarSectionTitle";
        heading.textContent = group.title;
        section.appendChild(heading);
        group.files.forEach(file => {
          const meta = metadataFor(file);
          const button = document.createElement("button");
          button.type = "button";
          button.className = "docItem";
          button.dataset.file = file.name;
          const mini = [meta.category, ...(meta.tags || []).slice(0,2)].filter(Boolean).join(" · ");
          button.innerHTML = `
            <span class="docIcon">${escapeHtml(meta.icon || "▤")}</span>
            <span class="docItemMeta">
              <span class="docItemTop"><span class="docName">${escapeHtml(meta.title)}</span>${meta.pinned ? '<span class="docItemPin" title="置頂文章">📌</span>' : ''}</span>
              ${mini ? `<span class="docItemMini">${escapeHtml(mini)}</span>` : ""}
            </span>
          `;
          button.addEventListener("click", () => openDocument(file.name));
          section.appendChild(button);
        });
        el.docList.appendChild(section);
      });
    }

    async function fetchMarkdown(file){
      if(state.documents.has(file.name)){
        return state.documents.get(file.name);
      }

      const response = await fetch(file.download_url, { cache:"no-store" });

      if(!response.ok){
        throw new Error(`無法讀取 ${file.name}`);
      }

      const markdown = await response.text();
      state.documents.set(file.name, markdown);
      return markdown;
    }

    async function openDocument(filename, updateHash = true){
      const file = state.files.find(item => item.name === filename);
      if(!file) return;

      state.activeFile = filename;

      document.querySelectorAll(".docItem").forEach(item => {
        item.classList.toggle("active", item.dataset.file === filename);
      });

      el.markdownBody.innerHTML = `
        <div class="loading">
          <span class="spinner"></span>
          正在讀取 ${escapeHtml(filename)}…
        </div>
      `;

      try{
        const markdown = await fetchMarkdown(file);
const parsed = parseFrontMatter(markdown, file.name);
const meta = parsed.meta;
meta.readingMinutes = meta.readingTime && meta.readingTime !== "auto" ? Number(meta.readingTime) || calculateReadingTime(parsed.body) : calculateReadingTime(parsed.body);
state.metadata.set(file.name, meta);
const title = meta.title;

const markdownWithoutFirstTitle = parsed.body.replace(
  /^#\s+.+(?:\r?\n)+/,
  ""
);

const normalizedMarkdown = normalizeLegacyMarkdownSource(markdownWithoutFirstTitle);
const rawHtml = marked.parse(normalizedMarkdown);

const safeHtml = DOMPurify.sanitize(rawHtml, {
  ADD_ATTR: ["target"]
});

el.markdownBody.innerHTML = safeHtml;
enhanceMarkdownCheckboxes();
normalizeLegacyComponents();
el.docTitle.textContent = `${meta.icon && meta.icon !== "▤" ? `${meta.icon} ` : ""}${title}`;
el.docFile.textContent = "";
el.breadcrumbName.textContent = title;
renderDocumentMetadata(meta);
document.title = `${title}｜夢回手冊`;

        prepareHeadings();
        setupInternalHeadingLinks();
        appendArticleNavigation();
        buildToc();
        updateActiveToc();

        if(updateHash){
          history.replaceState(null, "", `#doc=${encodeURIComponent(file.name)}`);
        }

        closeSidebar();
        el.content.scrollTo({ top:0, behavior:"auto" });

        const sectionMatch = window.location.hash.match(/(?:^#|&)section=([^&]+)/);
        if(sectionMatch){
          let sectionId = sectionMatch[1];
          try{ sectionId = decodeURIComponent(sectionId); }catch(error){}
          window.setTimeout(() => scrollToHeading(document.getElementById(sectionId), false), 80);
        }
      }catch(error){
        el.markdownBody.innerHTML = `
          <div class="emptyState">
            <strong>文章載入失敗</strong>
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }


    function renderDocumentMetadata(meta){
      const badges = [];
      const color = normalizeColor(meta.pillColor || meta.color);
      (meta.pills || []).filter(Boolean).forEach(text => badges.push(`<span class="pill ${color}">${escapeHtml(text)}</span>`));
      if(meta.featured) badges.push('<span class="badge gold">★ 精選</span>');
      if(meta.new) badges.push('<span class="badge green">NEW</span>');
      if(meta.hot || meta.popular) badges.push('<span class="badge red">HOT</span>');
      if(meta.status) badges.push(`<span class="badge purple">${escapeHtml(meta.status)}</span>`);
      if(meta.version) badges.push(`<span class="badge blue">版本 ${escapeHtml(meta.version)}</span>`);
      if(meta.difficulty) badges.push(`<span class="badge cyan">${escapeHtml(meta.difficulty)}</span>`);
      el.docBadges.innerHTML = badges.join("");
      el.docBadges.hidden = !badges.length;

      el.docDescription.textContent = meta.description || "";
      el.docDescription.hidden = !meta.description;

      const items = [];
      if(meta.author) items.push(`<span class="docMetaItem">👤 <strong>${escapeHtml(meta.author)}</strong></span>`);
      if(meta.created) items.push(`<span class="docMetaItem">📅 建立 <strong>${escapeHtml(formatDateValue(meta.created))}</strong></span>`);
      if(meta.updated) items.push(`<span class="docMetaItem">✏️ 更新 <strong>${escapeHtml(formatDateValue(meta.updated))}</strong></span>`);
      items.push(`<span class="docMetaItem">⏱️ 約 <strong>${escapeHtml(meta.readingMinutes)}</strong> 分鐘</span>`);
      if(meta.category) items.push(`<span class="docMetaItem">📂 <strong>${escapeHtml(meta.category)}</strong></span>`);
      if((meta.tags || []).length) items.push(`<span class="docMetaItem">🏷️ <strong>${escapeHtml(meta.tags.join(" · "))}</strong></span>`);
      el.docMetaPanel.innerHTML = items.join("");
      el.docMetaPanel.hidden = !items.length;
    }

    function appendArticleNavigation(){
      const visible = state.files.filter(file => !metadataFor(file).hidden && !metadataFor(file).draft);
      const index = visible.findIndex(file => file.name === state.activeFile);
      if(index < 0) return;
      const prev = visible[index-1];
      const next = visible[index+1];
      if(!prev && !next) return;
      const nav = document.createElement("nav");
      nav.className = "articleFooterNav";
      nav.setAttribute("aria-label","上一篇與下一篇");
      if(prev){
        const m = metadataFor(prev);
        nav.innerHTML += `<a class="articleNavBtn" href="#doc=${encodeURIComponent(prev.name)}" data-file="${escapeHtml(prev.name)}"><small>← 上一篇</small><strong>${escapeHtml(m.icon || "▤")} ${escapeHtml(m.title)}</strong></a>`;
      }else nav.innerHTML += '<span></span>';
      if(next){
        const m = metadataFor(next);
        nav.innerHTML += `<a class="articleNavBtn next" href="#doc=${encodeURIComponent(next.name)}" data-file="${escapeHtml(next.name)}"><small>下一篇 →</small><strong>${escapeHtml(m.icon || "▤")} ${escapeHtml(m.title)}</strong></a>`;
      }
      nav.querySelectorAll("[data-file]").forEach(link => link.addEventListener("click", event => {event.preventDefault();openDocument(link.dataset.file);}));
      el.markdownBody.appendChild(nav);
    }

    function normalizeLegacyMarkdownSource(markdown){
      /*
        marked/CommonMark ends a raw HTML block at a blank line. If the next
        line inside a legacy <div> is indented by four spaces, it is then
        interpreted as a code block. Older documents commonly use indented
        HTML, so normalise indentation only while inside supported legacy
        containers. Fenced code blocks are left untouched.
      */
      const supportedClasses = new Set([
        "steps", "step", "tip", "info", "notice", "warning", "danger",
        "success", "important", "question", "download", "boss", "reward",
        "requirement", "discord", "callout", "accordion", "tabs", "timeline",
        "gallery", "image-grid", "card", "cards", "pill-row"
      ]);

      const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
      let legacyDepth = 0;
      let inFence = false;
      let fenceMarker = "";

      return lines.map(line => {
        const fenceMatch = line.match(/^\s*(```+|~~~+)/);
        if(fenceMatch){
          const marker = fenceMatch[1][0];
          if(!inFence){
            inFence = true;
            fenceMarker = marker;
          }else if(marker === fenceMarker){
            inFence = false;
            fenceMarker = "";
          }
          return line;
        }
        if(inFence) return line;

        const openingTags = [...line.matchAll(/<div\b([^>]*)>/gi)];
        const closingCount = (line.match(/<\/div\s*>/gi) || []).length;
        const startsSupportedLegacy = openingTags.some(match => {
          const attrs = match[1] || "";
          const classMatch = attrs.match(/\bclass\s*=\s*["']([^"']+)["']/i);
          if(!classMatch) return false;
          return classMatch[1].split(/\s+/).some(name => supportedClasses.has(name));
        });

        const shouldDedent = legacyDepth > 0 || startsSupportedLegacy;
        let output = shouldDedent ? line.replace(/^[\t ]+/, "") : line;

        if(startsSupportedLegacy && legacyDepth === 0) legacyDepth = 1;
        else if(legacyDepth > 0) legacyDepth += openingTags.length;

        if(legacyDepth > 0){
          legacyDepth = Math.max(0, legacyDepth - closingCount);
        }

        return output;
      }).join("\n");
    }

    function normalizeLegacyComponents(){
      if(!el.markdownBody) return;

      // Remove empty paragraphs created when Markdown and raw HTML meet.
      el.markdownBody.querySelectorAll("p").forEach(paragraph => {
        const hasMedia = paragraph.querySelector("img, video, iframe, audio, svg");
        const text = paragraph.textContent.replace(/\u00a0/g, " ").trim();
        if(!hasMedia && !text && paragraph.children.length === 0){
          paragraph.remove();
        }
      });

      // A Markdown image placed directly between legacy step cards is attached
      // to the previous step so the image and explanation stay together.
      el.markdownBody.querySelectorAll(".steps").forEach(steps => {
        Array.from(steps.children).forEach(child => {
          const image = child.matches("img")
            ? child
            : (child.matches("p") && child.children.length === 1 ? child.querySelector(":scope > img") : null);
          if(!image) return;

          let previous = child.previousElementSibling;
          while(previous && !previous.classList.contains("step")){
            previous = previous.previousElementSibling;
          }
          if(previous){
            previous.appendChild(image);
            if(child !== image) child.remove();
          }
        });
      });

      // Repair inline bold content if an older CSS rule changed it to block.
      el.markdownBody.querySelectorAll(".step p strong, .step li strong, .step a strong").forEach(strong => {
        strong.style.removeProperty("display");
      });
    }


    function enhanceMarkdownCheckboxes(){
      const cells = el.markdownBody.querySelectorAll("td, th");

      cells.forEach(cell => {
        const html = cell.innerHTML;
        const match = html.match(/^\s*\[(x|X| )\]\s*/);

        if(!match) return;

        const checked = match[1].toLowerCase() === "x";

        cell.innerHTML = html.replace(
          /^\s*\[(x|X| )\]\s*/,
          `<label class="mdCheck">
             <input type="checkbox" ${checked ? "checked" : ""} disabled>
             <span class="mdCheckBox" aria-hidden="true"></span>
           </label>`
        );
      });
    }


    function prepareHeadings(){
      const headings = Array.from(
        el.markdownBody.querySelectorAll("h1, h2, h3, h4")
      );

      const used = new Set();

      headings.forEach((heading, index) => {
        let id = slugify(heading.textContent, index);

        while(used.has(id)){
          id = `${id}-${index}`;
        }

        used.add(id);
        heading.id = id;
      });

      el.markdownBody.querySelectorAll("a[href]").forEach(link => {
        const href = link.getAttribute("href");

        if(href && /^https?:\/\//i.test(href)){
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
      });
    }

    function scrollToHeading(target, updateUrl = false){
      if(!target) return;

      const contentTop = el.content.getBoundingClientRect().top;
      const targetTop = target.getBoundingClientRect().top;
      const destination = el.content.scrollTop + targetTop - contentTop - 24;

      el.content.scrollTo({
        top: Math.max(0, destination),
        behavior: "smooth"
      });

      target.classList.remove("headingFlash");
      void target.offsetWidth;
      target.classList.add("headingFlash");
      window.setTimeout(() => target.classList.remove("headingFlash"), 1800);

      if(updateUrl){
        const url = new URL(window.location.href);
        url.hash = `doc=${encodeURIComponent(state.activeFile)}&section=${encodeURIComponent(target.id)}`;
        history.replaceState(null, "", url);
      }
    }

    function setupInternalHeadingLinks(){
      el.markdownBody.querySelectorAll('a[href^="#"]').forEach(link => {
        const raw = link.getAttribute("href").slice(1);
        let id = raw;
        try{ id = decodeURIComponent(raw); }catch(error){}

        const target = document.getElementById(id);
        if(!target) return;

        link.classList.add("sectionJumpLink");
        link.addEventListener("click", event => {
          event.preventDefault();
          scrollToHeading(target, true);
        });
      });

      el.markdownBody.querySelectorAll("h2, h3, h4").forEach(heading => {
        heading.classList.add("linkableHeading");
        heading.title = "點擊複製此章節連結";
        heading.addEventListener("click", event => {
          if(event.target.closest("a, button, code")) return;
          const link = `${window.location.href.split("#")[0]}#doc=${encodeURIComponent(state.activeFile)}&section=${encodeURIComponent(heading.id)}`;
          navigator.clipboard?.writeText(link).then(() => {
            heading.classList.remove("headingFlash");
            void heading.offsetWidth;
            heading.classList.add("headingFlash");
            window.setTimeout(() => heading.classList.remove("headingFlash"), 1200);
          }).catch(() => {});
        });
      });
    }

    function buildToc(){
      const headings = Array.from(
        el.markdownBody.querySelectorAll("h2, h3, h4")
      );

      if(!headings.length){
        el.tocList.innerHTML = `
          <span style="color:var(--muted);font-size:12px;">
            此文章沒有小標題
          </span>
        `;
        return;
      }

      el.tocList.innerHTML = headings.map(heading => `
        <a class="tocLink ${heading.tagName === "H3" ? "level3" : heading.tagName === "H4" ? "level4" : ""}"
           href="#${heading.id}">
          ${escapeHtml(heading.textContent)}
        </a>
      `).join("");

      el.tocList.querySelectorAll(".tocLink").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          const target = document.getElementById(link.getAttribute("href").slice(1));
          scrollToHeading(target, true);
        });
      });
    }


    function updateActiveToc(){
      const headings = Array.from(
        el.markdownBody.querySelectorAll("h2, h3, h4")
      );

      const links = Array.from(
        el.tocList.querySelectorAll(".tocLink")
      );

      if(!headings.length || !links.length) return;

      let currentId = headings[0].id;

      const contentTop = el.content.getBoundingClientRect().top;

      for(const heading of headings){
        const top = heading.getBoundingClientRect().top - contentTop;

        if(top <= 120){
          currentId = heading.id;
        }else{
          break;
        }
      }

      links.forEach(link => {
        const isActive =
          link.getAttribute("href") === `#${currentId}`;

        link.classList.toggle("active", isActive);

        if(isActive){
          const tocPanel = link.closest(".toc");

          if(tocPanel){
            const linkTop = link.offsetTop;
            const linkBottom = linkTop + link.offsetHeight;
            const visibleTop = tocPanel.scrollTop;
            const visibleBottom = visibleTop + tocPanel.clientHeight;

            if(linkTop < visibleTop + 18){
              tocPanel.scrollTop = Math.max(0, linkTop - 18);
            }else if(linkBottom > visibleBottom - 18){
              tocPanel.scrollTop =
                linkBottom - tocPanel.clientHeight + 18;
            }
          }
        }
      });
    }

    async function searchDocuments(keyword){
      const query = keyword.trim().toLowerCase();

      if(!query){
        el.searchResults.classList.remove("open");
        el.searchResults.innerHTML = "";
        return;
      }

      const results = [];

      for(const file of state.files){
        try{
          const markdown = await fetchMarkdown(file);
          const parsed = parseFrontMatter(markdown, file.name);
          const meta = parsed.meta;
          const title = meta.title;
          const plain = parsed.body
            .replace(/```[\s\S]*?```/g, " ")
            .replace(/[#>*_`\[\]()!-]/g, " ")
            .replace(/\s+/g, " ");

          const metadataText = [meta.category, meta.description, meta.author, meta.version, ...(meta.tags || []), ...(meta.aliases || [])].filter(Boolean).join(" ");
          const haystack = `${title} ${metadataText} ${plain}`.toLowerCase();

          if(haystack.includes(query)){
            const position = haystack.indexOf(query);
            const start = Math.max(0, position - 45);
            const snippet = plain.slice(start, start + 120);

            results.push({
              file: file.name,
              title,
              snippet
            });
          }
        }catch(error){
          console.warn("Search skipped:", file.name, error);
        }
      }

      renderSearchResults(results, query);
    }

    function renderSearchResults(results, query){
      if(!results.length){
        el.searchResults.innerHTML = `
          <div style="padding:14px;color:var(--muted);font-size:12px;">
            找不到「${escapeHtml(query)}」
          </div>
        `;
      }else{
        el.searchResults.innerHTML = results.map(result => `
          <button class="searchResult" type="button"
                  data-file="${escapeHtml(result.file)}">
            <strong>${highlight(result.title, query)}</strong>
            <span>${highlight(result.snippet, query)}</span>
          </button>
        `).join("");
      }

      el.searchResults.classList.add("open");

      el.searchResults.querySelectorAll(".searchResult").forEach(button => {
        button.addEventListener("click", async () => {
          await openDocument(button.dataset.file);
          el.searchResults.classList.remove("open");
          el.searchInput.value = "";
        });
      });
    }

    function highlight(text, query){
      const safeText = escapeHtml(text);
      const safeQuery = escapeRegExp(escapeHtml(query));

      return safeText.replace(
        new RegExp(`(${safeQuery})`, "ig"),
        "<mark>$1</mark>"
      );
    }

    function escapeHtml(value){
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(value){
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    let searchTimer;

    el.searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(
        () => searchDocuments(el.searchInput.value),
        260
      );
    });

    el.searchInput.addEventListener("keydown", event => {
      if(event.key === "Escape"){
        el.searchInput.value = "";
        el.searchResults.classList.remove("open");
      }
    });

    document.addEventListener("keydown", event => {
      if(event.key === "/" && document.activeElement !== el.searchInput){
        event.preventDefault();
        el.searchInput.focus();
      }
    });

    document.addEventListener("click", event => {
      if(!event.target.closest(".searchWrap")){
        el.searchResults.classList.remove("open");
      }
    });

    function openSidebar(){
      el.sidebar.classList.add("open");
      el.sidebarBackdrop.classList.add("open");
      el.mobileMenuBtn.setAttribute("aria-expanded", "true");
      el.sidebar.setAttribute("aria-hidden", "false");
      if(typeof syncBodyLock === "function") syncBodyLock();
    }

    function closeSidebar(){
      el.sidebar.classList.remove("open");
      el.sidebarBackdrop.classList.remove("open");
      el.mobileMenuBtn.setAttribute("aria-expanded", "false");
      el.sidebar.setAttribute("aria-hidden", "true");
      if(typeof syncBodyLock === "function") syncBodyLock();
    }

    el.mobileMenuBtn.addEventListener("click", openSidebar);
    el.sidebarBackdrop.addEventListener("click", closeSidebar);


    el.content.addEventListener(
      "scroll",
      updateActiveToc,
      { passive:true }
    );

    window.addEventListener(
      "resize",
      updateActiveToc,
      { passive:true }
    );


    function applyTheme(theme){
      const finalTheme = theme === "dark" ? "dark" : "light";

      document.documentElement.dataset.theme = finalTheme;
      localStorage.setItem("wwm-docs-theme-v2", finalTheme);
      localStorage.setItem("registration_theme", finalTheme);
      localStorage.setItem("wwm-home-theme-v2", finalTheme);

      const isDark = finalTheme === "dark";

      el.themeToggle.textContent = isDark ? "☀ 白天" : "☾ 夜間";

      el.themeToggle.setAttribute(
        "aria-label",
        isDark ? "切換到白天模式" : "切換到夜晚模式"
      );
    }

    function initTheme(){
      const savedTheme = localStorage.getItem("registration_theme") || localStorage.getItem("wwm-home-theme-v2") || localStorage.getItem("wwm-docs-theme-v2");

      // 預設使用黑夜模式；使用者切換後仍會記住選擇。
      applyTheme(savedTheme || "dark");

      el.themeToggle.addEventListener("click", () => {
        const currentTheme =
          document.documentElement.dataset.theme || "light";

        applyTheme(currentTheme === "dark" ? "light" : "dark");
      });
    }


    /* =========================================================
       DOCUMENTATION V3 — MOBILE INTERACTIONS
       ========================================================= */
    const v3 = {
      drawerClose: document.getElementById("mobileDrawerClose"),
      drawerSearch: document.getElementById("mobileDrawerSearchInput"),
      tocBtn: document.getElementById("mobileTocBtn"),
      tocSheet: document.getElementById("mobileTocSheet"),
      tocBackdrop: document.getElementById("mobileTocBackdrop"),
      tocClose: document.getElementById("mobileTocClose"),
      tocList: document.getElementById("mobileTocList"),
      backToTop: document.getElementById("backToTopBtn"),
      lightbox: document.getElementById("imageLightbox"),
      lightboxImage: document.getElementById("imageLightboxImage"),
      lightboxClose: document.getElementById("imageLightboxClose")
    };

    function syncBodyLock(){
      const drawerOpen = el.sidebar.classList.contains("open");
      const sheetOpen = v3.tocSheet.classList.contains("open");
      const lightboxOpen = v3.lightbox.classList.contains("open");
      document.body.classList.toggle("sidebar-open", drawerOpen);
      document.body.classList.toggle("sheet-open", sheetOpen);
      document.body.classList.toggle("lightbox-open", lightboxOpen);
    }

    const originalOpenSidebar = openSidebar;
    openSidebar = function(){
      originalOpenSidebar();
      el.mobileMenuBtn.setAttribute("aria-expanded", "true");
      el.sidebar.setAttribute("aria-hidden", "false");
      syncBodyLock();
      setTimeout(() => v3.drawerSearch && v3.drawerSearch.focus(), 280);
    };

    const originalCloseSidebar = closeSidebar;
    closeSidebar = function(){
      originalCloseSidebar();
      el.mobileMenuBtn.setAttribute("aria-expanded", "false");
      el.sidebar.setAttribute("aria-hidden", "true");
      syncBodyLock();
    };

    el.mobileMenuBtn.setAttribute("aria-expanded", "false");
    v3.drawerClose.addEventListener("click", closeSidebar);

    v3.drawerSearch.addEventListener("input", () => {
      const query = v3.drawerSearch.value.trim().toLowerCase();
      document.querySelectorAll(".docItem").forEach(item => {
        const name = item.textContent.toLowerCase();
        item.hidden = query && !name.includes(query);
      });
    });

    function openMobileToc(){
      v3.tocList.innerHTML = el.tocList.innerHTML || '<span style="color:var(--muted);font-size:12px;">目前沒有目錄</span>';
      v3.tocSheet.classList.add("open");
      v3.tocBackdrop.classList.add("open");
      v3.tocSheet.setAttribute("aria-hidden", "false");
      syncBodyLock();
      v3.tocList.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => closeMobileToc(), { once:true });
      });
    }

    function closeMobileToc(){
      v3.tocSheet.classList.remove("open");
      v3.tocBackdrop.classList.remove("open");
      v3.tocSheet.setAttribute("aria-hidden", "true");
      syncBodyLock();
    }

    v3.tocBtn.addEventListener("click", openMobileToc);
    v3.tocClose.addEventListener("click", closeMobileToc);
    v3.tocBackdrop.addEventListener("click", closeMobileToc);

    function getScrollTop(){
      return window.innerWidth <= 760 ? window.scrollY : el.content.scrollTop;
    }

    function updateBackToTop(){
      v3.backToTop.classList.toggle("show", getScrollTop() > 480);
    }

    window.addEventListener("scroll", updateBackToTop, { passive:true });
    el.content.addEventListener("scroll", updateBackToTop, { passive:true });
    v3.backToTop.addEventListener("click", () => {
      if(window.innerWidth <= 760){
        window.scrollTo({ top:0, behavior:"smooth" });
      }else{
        el.content.scrollTo({ top:0, behavior:"smooth" });
      }
    });

    function setCodeCopyState(button,state="idle"){
      const paths = {
        idle:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
        success:'<path d="m5 12 4 4L19 6"/>',
        error:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4m0 3h.01"/>'
      };
      const labels = {idle:"複製",success:"已複製",error:"無法複製"};
      button.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[state]}</svg>`;
      const label = document.createElement("span");
      label.className = "copyLabel";
      label.textContent = labels[state];
      button.appendChild(label);
      if(state === "idle") delete button.dataset.state;
      else button.dataset.state = state;
    }

    async function copyCodeText(text){
      if(navigator.clipboard?.writeText){
        try{ await navigator.clipboard.writeText(text); return; }catch(error){}
      }
      // Clipboard permission may be unavailable; preserve a user-triggered fallback.
      const previousFocus = document.activeElement;
      const selection = window.getSelection();
      const ranges = selection ? Array.from({length:selection.rangeCount},(_,i)=>selection.getRangeAt(i).cloneRange()) : [];
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.readOnly = true;
      textarea.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
      document.body.appendChild(textarea);
      try{
        textarea.focus({preventScroll:true});
        textarea.select();
        if(!document.execCommand("copy")) throw new Error("Clipboard unavailable");
      }finally{
        textarea.remove();
        previousFocus?.focus({preventScroll:true});
        if(selection){ selection.removeAllRanges(); ranges.forEach(range=>selection.addRange(range)); }
      }
    }

    function enhanceRenderedContentV3(){
      el.markdownBody.querySelectorAll("pre").forEach(pre => {
        if(pre.closest(".codeBlock")) return;
        const code = pre.querySelector("code");
        // Store code text before adding any controls; UI labels must never be copied.
        pre.querySelector(".copyCodeBtn")?.remove();
        const text = code ? code.textContent : pre.textContent;
        const wrapper = document.createElement("div");
        wrapper.className = "codeBlock";
        const header = document.createElement("div");
        header.className = "codeBlockHeader";
        const language = document.createElement("span");
        language.className = "codeLanguage";
        const name = Array.from(code?.classList || []).map(value=>/^language-([a-z0-9_+-]+)$/i.exec(value)?.[1]).find(Boolean);
        language.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg>';
        language.appendChild(document.createTextNode(!name ? "CODE" : name === "text" ? "純文字" : name.toUpperCase()));
        const button = document.createElement("button");
        button.type = "button";
        button.className = "copyCodeBtn";
        setCodeCopyState(button);
        button.setAttribute("aria-label", "複製此區塊內容");
        button.setAttribute("aria-live", "polite");
        let copying = false;
        let feedbackTimer;
        button.addEventListener("click", async () => {
          if(copying) return;
          copying = true;
          clearTimeout(feedbackTimer);
          button.setAttribute("aria-busy", "true");
          try{
            await copyCodeText(text);
            setCodeCopyState(button,"success");
          }catch(error){
            setCodeCopyState(button,"error");
            button.title = "請選取區塊中的文字，手動複製。";
          }finally{
            copying = false;
            button.removeAttribute("aria-busy");
          }
          feedbackTimer = setTimeout(() => {
            setCodeCopyState(button);
            button.removeAttribute("title");
          }, 1600);
        });
        header.append(language,button);
        pre.before(wrapper);
        wrapper.append(header,pre);
      });

      el.markdownBody.querySelectorAll("img").forEach(img => {
        if(img.dataset.lightboxReady === "true") return;
        img.dataset.lightboxReady = "true";
        img.tabIndex = 0;
        img.setAttribute("role", "button");
        img.setAttribute("aria-label", "點擊放大圖片");
        const open = () => {
          v3.lightboxImage.src = img.currentSrc || img.src;
          v3.lightboxImage.alt = img.alt || "放大圖片";
          v3.lightbox.classList.add("open");
          v3.lightbox.setAttribute("aria-hidden", "false");
          syncBodyLock();
        };
        img.addEventListener("click", open);
        img.addEventListener("keydown", event => {
          if(event.key === "Enter" || event.key === " "){
            event.preventDefault();
            open();
          }
        });
      });
    }

    function closeLightbox(){
      v3.lightbox.classList.remove("open");
      v3.lightbox.setAttribute("aria-hidden", "true");
      v3.lightboxImage.removeAttribute("src");
      syncBodyLock();
    }

    v3.lightboxClose.addEventListener("click", closeLightbox);
    v3.lightbox.addEventListener("click", event => {
      if(event.target === v3.lightbox) closeLightbox();
    });

    document.addEventListener("keydown", event => {
      if(event.key !== "Escape") return;
      if(v3.lightbox.classList.contains("open")) closeLightbox();
      else if(v3.tocSheet.classList.contains("open")) closeMobileToc();
      else if(el.sidebar.classList.contains("open")) closeSidebar();
    });

    const markdownObserver = new MutationObserver(() => enhanceRenderedContentV3());
    markdownObserver.observe(el.markdownBody, { childList:true, subtree:true });
    updateBackToTop();

    initTheme();

    loadFolder();
  </script>

<script>
/* Documentation v3.2 mobile scroll safety */
(function(){
  const mq = window.matchMedia('(max-width:760px)');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');

  function repairMobileScroll(){
    if(!mq.matches) return;
    const drawerOpen = sidebar && sidebar.classList.contains('open');
    document.body.classList.toggle('sidebar-open', !!drawerOpen);

    if(!drawerOpen &&
       !document.body.classList.contains('sheet-open') &&
       !document.body.classList.contains('lightbox-open')){
      document.documentElement.style.removeProperty('overflow');
      document.body.style.removeProperty('overflow');
      document.body.style.removeProperty('position');
      document.body.style.removeProperty('top');
      document.body.style.removeProperty('width');
    }
  }

  if(sidebar){
    new MutationObserver(repairMobileScroll).observe(sidebar, {
      attributes:true,
      attributeFilter:['class']
    });
  }

  if(backdrop){
    backdrop.addEventListener('click', function(){
      setTimeout(repairMobileScroll, 0);
    }, {passive:true});
  }

  window.addEventListener('pageshow', repairMobileScroll, {passive:true});
  window.addEventListener('resize', repairMobileScroll, {passive:true});
  document.addEventListener('visibilitychange', repairMobileScroll, {passive:true});
  repairMobileScroll();
})();
</script>

<script id="wwm-shared-feedback">
(function(){
  'use strict';
  let stack=document.getElementById('wwmToastStack');
  if(!stack){stack=document.createElement('div');stack.id='wwmToastStack';stack.className='wwm-toast-stack';stack.setAttribute('aria-live','polite');document.body.appendChild(stack);}
  window.showAppToast=function(message,tone='info',title=''){
    const kind=tone==='danger'?'error':tone;
    const el=document.createElement('div');el.className='wwm-toast';el.dataset.kind=kind;
    const icon=document.createElement('span');icon.className='wwm-toast-icon';icon.textContent=kind==='success'?'✓':kind==='error'?'!':'✿';
    const text=document.createElement('span');text.textContent=(title?title+' · ':'')+String(message);
    el.append(icon,text);stack.appendChild(el);
    const clear=()=>{el.remove();};const timeout=setTimeout(clear,3800);
    el.addEventListener('click',()=>{clearTimeout(timeout);clear();});
  };
  const root=document.documentElement;
  const bar=document.getElementById('floatingNav');
  // Keep the fixed desktop navbar neat when the page scrolls.
  const updateScroll=()=>bar?.classList.toggle('scrolled',window.scrollY>40);
  window.addEventListener('scroll',updateScroll,{passive:true});updateScroll();
})();

<script id="wwm-shared-mobile-menu">
(function(){
 'use strict';
 const $=id=>document.getElementById(id);
 const bar=$('floatingNav'), burger=$('pveMnavBurger'), panel=$('pveMnavPanel'), scrim=$('pveMnavScrim'), close=$('pveMnavClose'),
       brand=$('pveMnavBrand'), theme=$('pveMnavTheme');
 if(!bar||!burger||!panel||!scrim||!close||!brand||!theme)return;
 const mobile=window.matchMedia('(max-width:768px)');
 const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
 let expanded=false,lastFocus=null,longPressTimer=null,longPressTriggered=false,brandTaps=0,brandTapTime=0;
 function setPanelTop(){
   const bottom=bar.getBoundingClientRect().bottom;
   document.documentElement.style.setProperty('--pve-mnav-panel-top',Math.ceil(bottom+9)+'px');
 }
 function setExpanded(next, focusReturn=true){
   if(next && !mobile.matches)return;
   if(expanded===next)return;
   expanded=next;
   if(next){
     lastFocus=document.activeElement;
     setPanelTop();
     panel.hidden=false;scrim.hidden=false;
     panel.setAttribute('aria-hidden','false');
     burger.setAttribute('aria-expanded','true');burger.setAttribute('aria-label','關閉網站選單');
     document.body.classList.add('pve-mnav-open');
     requestAnimationFrame(()=>{
       panel.classList.add('is-open');scrim.classList.add('is-open');
       close.focus({preventScroll:true});
     });
   }else{
     panel.classList.remove('is-open');scrim.classList.remove('is-open');
     panel.setAttribute('aria-hidden','true');
     burger.setAttribute('aria-expanded','false');burger.setAttribute('aria-label','開啟網站選單');
     document.body.classList.remove('pve-mnav-open');
     panel.hidden=true;scrim.hidden=true;
     if(focusReturn && lastFocus?.isConnected)lastFocus.focus({preventScroll:true});
     lastFocus=null;
   }
 }
 burger.addEventListener('click',e=>{
   if(longPressTriggered){longPressTriggered=false;e.preventDefault();return;}
   setExpanded(!expanded);
 });
 close.addEventListener('click',()=>setExpanded(false));
 scrim.addEventListener('click',()=>setExpanded(false));
 panel.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>setExpanded(false,false)));
 document.addEventListener('keydown',e=>{
   if(e.key==='Escape'&&expanded){e.preventDefault();setExpanded(false);return;}
   if(e.key==='Tab'&&expanded){
     const interactive=[...panel.querySelectorAll('button:not([disabled]),a[href]')];
     const first=interactive[0],last=interactive.at(-1);
     if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
     else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
   }
 });
 window.addEventListener('resize',()=>{if(!mobile.matches)setExpanded(false,false);else if(expanded)setPanelTop();},{passive:true});
 window.addEventListener('scroll',()=>{if(expanded)setPanelTop();},{passive:true});
 window.visualViewport?.addEventListener('resize',()=>{if(expanded)setPanelTop();},{passive:true});
 // The existing theme toggle remains the single source of truth. Mirror its state here.
 function updateTheme(){
   const light=document.documentElement.dataset.theme==='light';
   theme.setAttribute('aria-label',light?'切換至深色模式':'切換至淺色模式');
   theme.setAttribute('title',light?'切換至深色模式':'切換至淺色模式');
 }
 theme.addEventListener('click',()=>{
   $('siteThemeToggleBtn')?.click();updateTheme();
 });
 new MutationObserver(updateTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
 updateTheme();
 brand.addEventListener('click',()=>{
   if(!mobile.matches)return;
   window.scrollTo({top:0,behavior:reduceMotion.matches?'auto':'smooth'});
   const now=Date.now();brandTaps=now-brandTapTime<2500?brandTaps+1:1;brandTapTime=now;
   if(brandTaps>=5){brandTaps=0;triggerSecret();}
 });
 // Easter egg: press and hold the burger for ~1 second (or tap the flower 5 times).
 function triggerSecret(){
   setExpanded(false,false);
   if(typeof window.showAppToast==='function')window.showAppToast('🌸 花深處的秘密被你找到了！江湖路遠，繁花相伴。','success','隱藏彩蛋');
   if(reduceMotion.matches)return;
   const layer=document.createElement('div');layer.className='pve-petal-layer';layer.setAttribute('aria-hidden','true');
   const palette=['#eaa5c9','#cfa8f1','#f9c6d8','#a5c4ff','#f4d3ef'];
   for(let i=0;i<23;i++){
     const petal=document.createElement('span');petal.className='pve-secret-petal';petal.textContent=i%4===0?'✿':'❀';
     petal.style.setProperty('--petal-left',`${3+(i*37)%94}%`);
     petal.style.setProperty('--petal-color',palette[i%palette.length]);
     petal.style.setProperty('--petal-size',`${13+i%6*4}px`);
     petal.style.setProperty('--petal-duration',`${2.7+(i%5)*.36}s`);
     petal.style.setProperty('--petal-drift',`${-90+(i*27)%180}px`);
     petal.style.setProperty('--petal-rotate',`${(i%2===0?1:-1)*(190+i*22)}deg`);
     petal.style.animationDelay=`${(i%8)*.12}s`;
     layer.appendChild(petal);
   }
   document.body.appendChild(layer);
   setTimeout(()=>layer.remove(),5600);
 }
 function cancelLongPress(){if(longPressTimer!==null){clearTimeout(longPressTimer);longPressTimer=null;}}
 burger.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;
   longPressTriggered=false;
   cancelLongPress();
   longPressTimer=setTimeout(()=>{longPressTriggered=true;triggerSecret();cancelLongPress();},1050);
 });
 for(const event of ['pointerup','pointercancel','pointerleave'])burger.addEventListener(event,cancelLongPress);
 burger.addEventListener('contextmenu',e=>{if(mobile.matches)e.preventDefault();});
 burger.addEventListener('keydown',e=>{
   if(e.shiftKey&&e.key==='Enter'){e.preventDefault();longPressTriggered=true;triggerSecret();}
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelLongPress();});
})();
</script>
