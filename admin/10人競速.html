<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夢回花深處｜10 人副本競速</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
try{
  const t=localStorage.getItem("registration_theme")||localStorage.getItem("wwm-home-theme-v2")||"dark";
  document.documentElement.dataset.theme=t==="light"?"light":"dark";
}catch(e){}
</script>
<style>
:root{
  --bg:#0b1020;--surface:#11192d;--surface2:#17213a;--surface3:#1e2a47;
  --line:#283956;--line2:#3b5074;--text:#eef2ff;--muted:#9caac4;--soft:#71809a;
  --blue:#6ea8ff;--purple:#8b5cf6;--red:#ff6b81;--green:#34d399;--orange:#fbbf24;
  --shadow:0 16px 46px rgba(0,0,0,.26);
}
html[data-theme="light"]{
  --bg:#eef3fb;--surface:#fff;--surface2:#f5f8fd;--surface3:#eaf0f9;
  --line:#d8e2f0;--line2:#c1cfe2;--text:#18243a;--muted:#60708a;--soft:#8a97a9;
  --blue:#4f8ef7;--purple:#7c3aed;--red:#dc3958;--green:#059669;--orange:#b7791f;
  --shadow:0 14px 36px rgba(55,72,103,.12);
}
*{box-sizing:border-box}
html{color-scheme:dark} html[data-theme="light"]{color-scheme:light}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at 13% 5%,color-mix(in srgb,var(--blue) 13%,transparent),transparent 29%),
    radial-gradient(circle at 88% 7%,color-mix(in srgb,var(--purple) 12%,transparent),transparent 27%),
    var(--bg);
  color:var(--text);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.topbar{
  position:fixed;z-index:5000;top:18px;left:50%;transform:translateX(-50%);
  width:min(1180px,calc(100% - 28px));min-height:64px;
  border:1px solid var(--line);border-radius:999px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(18px);box-shadow:0 12px 38px rgba(0,0,0,.16)
}
.topbar-inner{min-height:64px;padding:8px 12px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand,.nav-wrap,.nav{display:flex;align-items:center;gap:7px}
.badge{padding:7px 11px;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:11px;font-weight:900;white-space:nowrap}
.badge.sub{background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.nav{gap:4px}.nav a{padding:8px 10px;border-radius:999px;color:var(--muted);font-size:10.5px;font-weight:850;text-decoration:none;white-space:nowrap}
.nav a:hover,.nav a.active{background:var(--surface2);color:var(--text)}
.theme-btn{min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--text);font-size:10px;font-weight:900}
.page{width:min(1540px,calc(100% - 36px));margin:0 auto;padding:104px 0 44px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}
.kicker{color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.14em}
h1{margin:4px 0 6px;font-size:31px;line-height:1.15}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.hero-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:42px;padding:9px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font-size:11px;font-weight:900}
.btn:hover{background:var(--surface2)}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}.btn.danger{color:var(--red)}
.version{display:inline-flex;margin-left:6px;padding:3px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--blue);font-size:8px;font-weight:900;vertical-align:middle}
.cross{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:850}
.cross a{color:var(--blue);text-decoration:none;font-weight:950}
.cycle{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:14px;padding:16px 17px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:var(--shadow)
}
.cycle-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.label{color:var(--muted);font-size:8.5px;font-weight:900;letter-spacing:.08em}
.cycle select{min-width:300px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--text);font-size:12px;font-weight:850}
.state-pill,.sync-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:8.5px;font-weight:900;color:var(--muted)}
.state-pill.current{color:var(--green)}.state-pill.review{color:var(--orange)}
.sync-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--soft)}
.sync-pill.ok::before{background:var(--green)}.sync-pill.saving::before{background:var(--orange)}.sync-pill.local::before{background:var(--red)}
.cycle-meta{color:var(--muted);font-size:10px}
.workspace{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;align-items:start}
.panel,.board{border:1px solid var(--line);border-radius:19px;background:var(--surface);box-shadow:var(--shadow)}
.player-panel{position:sticky;top:96px;overflow:hidden}.panel-head{padding:16px;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.panel-title h2{margin:0;font-size:20px}.small{color:var(--muted);font-size:9px}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font-weight:900}
.search{width:100%;height:44px;margin-top:9px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font-size:11px;outline:0}
.shared-note{margin-top:7px;padding:7px 9px;border:1px solid color-mix(in srgb,var(--blue) 24%,var(--line));border-radius:9px;background:color-mix(in srgb,var(--blue) 5%,var(--surface2));color:var(--muted);font-size:8.5px;line-height:1.45}
.metric-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.metric-tabs button{min-height:34px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:9.5px;font-weight:900}
.metric-tabs button.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.filter-note{display:none;margin-top:8px;padding:7px 9px;border:1px solid color-mix(in srgb,var(--blue) 28%,var(--line));border-radius:9px;background:color-mix(in srgb,var(--blue) 6%,var(--surface2));color:var(--muted);font-size:9px}
.filter-note.show{display:flex;align-items:center;justify-content:space-between;gap:7px}.filter-note strong{color:var(--text)}.filter-note button{border:0;background:none;color:var(--blue);font-size:9px;font-weight:900}
.player-list{display:grid;gap:5px;max-height:calc(100vh - 360px);overflow:auto;padding:8px}
.player-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:58px;padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);cursor:pointer;user-select:none}
.player-row:hover{border-color:var(--line2);background:var(--surface3)}.player-row.selected{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--surface2))}
.player-name{font-size:14px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-role{margin-top:2px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-metric{text-align:right;min-width:82px}.player-metric strong{display:block;font-size:15px}.player-metric strong.warn{color:var(--red)}.player-metric strong.best{color:var(--purple)}.player-metric span{display:block;margin-top:2px;color:var(--muted);font-size:8px}
.player-panel.expanded{position:fixed;z-index:7000;inset:92px 20px 20px;display:flex;flex-direction:column}
.player-panel.expanded .player-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));max-height:none;flex:1;padding:12px;gap:8px}
.player-panel.expanded .player-row{min-height:86px;padding:11px 12px}.player-panel.expanded .player-name{font-size:16px}.player-panel.expanded .player-role{font-size:10px}
.board{padding:17px;min-width:0}
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.board-head h2{margin:0;font-size:23px}.board-head p{margin:4px 0 0;color:var(--muted);font-size:10.5px}
.create-box{margin-bottom:12px;padding:14px;border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--blue) 5%,var(--surface))}
.create-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}.create-head strong{font-size:13px}.create-head span{display:block;margin-top:3px;color:var(--muted);font-size:8.5px}
.create-grid{display:grid;grid-template-columns:minmax(180px,1fr) minmax(180px,1.25fr) auto;gap:7px;align-items:end}
.field{display:grid;gap:4px}.field label{color:var(--muted);font-size:8px;font-weight:900}
.input,.select{width:100%;height:40px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);outline:0;font-size:10.5px}
.quick-create{height:40px;padding:7px 13px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:9px;font-weight:950}
.review-note{margin-bottom:10px;padding:9px 11px;border:1px solid color-mix(in srgb,var(--orange) 35%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--orange) 7%,var(--surface2));color:var(--muted);font-size:9px}.review-note strong{color:var(--orange)}
.selected-player{display:none;margin-bottom:12px;padding:12px;border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));border-radius:13px;background:color-mix(in srgb,var(--blue) 5%,var(--surface))}
.selected-player.show{display:block}.selected-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.selected-name{font-size:15px;font-weight:950}.selected-meta{margin-top:3px;color:var(--muted);font-size:9px}
.selected-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}.stat{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.stat span{display:block;color:var(--muted);font-size:7.5px;font-weight:900}.stat strong{display:block;margin-top:3px;font-size:14px}
.quick{margin-bottom:12px;padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.quick-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.quick-head strong{font-size:13px}.quick-head span{font-size:9px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:7px}.quick-card{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);text-align:left}.quick-card:hover{border-color:var(--line2);background:var(--surface3)}
.quick-top{display:flex;justify-content:space-between;gap:6px}.quick-name{font-size:12px;font-weight:950}.quick-count{font-size:8px;color:var(--muted);font-weight:900}.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.quick-stat{padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}.quick-stat span{display:block;color:var(--muted);font-size:7.5px;font-weight:900}.quick-stat strong{display:block;margin-top:2px;font-size:11px}.quick-stat.best strong{color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}.chip{padding:2px 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);font-size:7.5px;font-weight:850}
.team-list{display:grid;gap:11px}.team-card{scroll-margin-top:110px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);overflow:hidden}.team-card.pending{border-color:color-mix(in srgb,var(--orange) 45%,var(--line))}.team-card.local{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.team-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.team-name{font-size:16px;font-weight:950}.team-meta{margin-top:3px;color:var(--muted);font-size:9px}.team-status{display:inline-flex;margin-left:6px;padding:3px 6px;border:1px solid var(--line);border-radius:999px;font-size:7.5px;font-weight:900;color:var(--muted)}
.team-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.team-actions button{min-height:31px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:8.5px;font-weight:900}
.team-body{padding:14px}.result-card{margin-bottom:11px;padding:11px;border:1px solid color-mix(in srgb,var(--blue) 24%,var(--line));border-radius:12px;background:var(--surface)}
.result-summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.result-box{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.result-box span{display:block;color:var(--muted);font-size:8px;font-weight:900}.result-box strong{display:block;margin-top:2px;font-size:18px}.result-box.best strong{color:var(--purple)}.result-box small{display:block;margin-top:2px;color:var(--muted);font-size:8px}
.result-grid{display:grid;grid-template-columns:150px 150px minmax(150px,1fr) auto;gap:7px;align-items:end}.save-result{height:40px;padding:7px 11px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:9px;font-weight:950}
.roster-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 0 7px}.roster-title strong{font-size:11px}.roster-title span{font-size:8.5px;color:var(--muted)}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.slot{position:relative;min-height:86px;padding:9px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center}.slot.filled{border-style:solid;background:var(--surface3)}
.slot-no{position:absolute;top:4px;left:5px;color:var(--soft);font-size:8px;font-weight:900}.slot strong{display:block;font-size:10px}.slot span{display:block;margin-top:2px;color:var(--muted);font-size:8px}.slot .limit{display:inline-flex;margin-top:4px;padding:2px 5px;border:1px solid var(--line);border-radius:999px;font-size:7px;font-weight:900}.slot .limit.warn{color:var(--red)}
.slot-actions{display:flex;justify-content:center;gap:4px;margin-top:5px}.slot-actions button,.add-slot{min-height:27px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text);font-size:7.5px;font-weight:900}.add-slot{color:var(--blue)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px;background:var(--surface2);font-size:10px;line-height:1.7}
.modal{position:fixed;z-index:9000;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,7,16,.72);backdrop-filter:blur(12px)}.modal.show{display:flex}.modal-card{width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--line2);border-radius:18px;background:var(--surface);box-shadow:0 30px 90px rgba(0,0,0,.42)}.modal-card.wide{width:min(860px,100%)}
.modal-title{margin:0;font-size:20px}.modal-sub{margin:5px 0 13px;color:var(--muted);font-size:10.5px;line-height:1.55}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.picker-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:55vh;overflow:auto}.picker-player{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);text-align:left}.picker-player:hover{border-color:var(--line2);background:var(--surface3)}.picker-player strong{font-size:10px}.picker-player span{font-size:8px;color:var(--muted)}
.editor{display:grid;gap:6px}.edit-row{display:grid;grid-template-columns:minmax(150px,1fr) 150px minmax(170px,1fr) auto;gap:6px}.edit-row input,.edit-row select{height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);font-size:10.5px}.edit-row button{width:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--red)}
.prof-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-bottom:6px}.prof-row input{height:40px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text)}.prof-row button{width:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--red)}
.history{display:grid;gap:6px}.history-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.history-time{font-size:12px;font-weight:950;color:var(--purple)}.history-row strong{font-size:9px}.history-row span{font-size:8px;color:var(--muted)}
.toast{position:fixed;z-index:10000;left:50%;bottom:24px;transform:translate(-50%,20px);padding:8px 12px;border-radius:999px;background:#111827;color:#fff;font-size:9px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.workspace{grid-template-columns:340px minmax(0,1fr)}.result-grid{grid-template-columns:1fr 1fr}.save-result{grid-column:1/-1}.create-grid{grid-template-columns:1fr 1fr}.quick-create{grid-column:1/-1}}
@media(max-width:760px){
  .topbar{top:10px;border-radius:20px}.topbar-inner{align-items:flex-start;flex-direction:column}.nav-wrap{width:100%;overflow:hidden}.nav{overflow-x:auto;width:100%}
  .page{padding-top:138px;width:calc(100% - 20px)}.hero{align-items:flex-start;flex-direction:column}.hero-actions{justify-content:flex-start}
  .cycle{align-items:flex-start;flex-direction:column}.cycle select{width:100%;min-width:0}.workspace{grid-template-columns:1fr}.player-panel{position:relative;top:auto}.player-list{max-height:420px}.player-panel.expanded{inset:132px 10px 10px}
  .roster{grid-template-columns:repeat(2,minmax(0,1fr))}.picker-list{grid-template-columns:1fr}.edit-row{grid-template-columns:1fr 120px}.edit-row .note{grid-column:1/-1}
  .selected-stats{grid-template-columns:1fr}.create-grid{grid-template-columns:1fr}
}

/* ===== v9 flexible roster / outsiders / collapsed teams / run history ===== */
.team-card .team-body{display:none}
.team-card.expanded .team-body{display:block}
.team-summary-bar{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(160px,.7fr) minmax(160px,.7fr) auto;
  gap:9px;
  align-items:center;
  width:100%;
}
.team-collapse-btn{
  min-height:34px;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  color:var(--text);
  font-size:8.5px;
  font-weight:900;
}
.team-mini-stat{
  padding:7px 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
}
.team-mini-stat span{
  display:block;
  color:var(--muted);
  font-size:7.5px;
  font-weight:900;
}
.team-mini-stat strong{
  display:block;
  margin-top:2px;
  font-size:11px;
}
.team-mini-stat.best strong{color:var(--purple)}
.team-card.expanded .team-collapse-btn{
  color:var(--blue);
}
.outsider-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  margin-top:4px;
  padding:2px 5px;
  border:1px solid color-mix(in srgb,var(--orange) 38%,var(--line));
  border-radius:999px;
  background:color-mix(in srgb,var(--orange) 7%,var(--surface2));
  color:var(--orange)!important;
  font-size:7px!important;
  font-weight:900;
}
.picker-outsider{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  width:100%;
  margin:8px 0;
  padding:10px 11px;
  border:1px solid color-mix(in srgb,var(--orange) 38%,var(--line));
  border-radius:10px;
  background:color-mix(in srgb,var(--orange) 7%,var(--surface2));
  color:var(--text);
  text-align:left;
}
.picker-outsider strong{font-size:10px}

/* ===== v21 UI polish ===== */

/* Overall hierarchy */
body{
  letter-spacing:.01em;
}
.page{
  padding-bottom:56px;
}
.panel,.board{
  border-color:color-mix(in srgb,var(--line2) 60%,var(--line));
}
.board{
  background:linear-gradient(
    180deg,
    color-mix(in srgb,var(--surface) 97%,var(--blue) 3%),
    var(--surface)
  );
}
.panel-head,
.board-head{
  position:relative;
}
.panel-head::after,
.board-head::after{
  content:"";
  position:absolute;
  left:16px;
  right:16px;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent);
  opacity:.5;
}

/* Main action buttons */
.btn{
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.btn:hover{
  transform:translateY(-1px);
}
.btn.primary{
  box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 16%,transparent);
}

/* Create team */
.create-box{
  border-width:1.5px;
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 4%,transparent);
}
.create-head{
  margin-bottom:11px;
}
.quick-create{
  min-width:140px;
  box-shadow:0 8px 18px color-mix(in srgb,var(--blue) 16%,transparent);
}

/* Player list */
.player-row{
  transition:border-color .15s ease,background .15s ease,transform .15s ease;
}
.player-row:hover{
  transform:translateY(-1px);
}
.player-row.selected{
  box-shadow:
    inset 4px 0 0 var(--blue),
    0 6px 18px color-mix(in srgb,var(--blue) 8%,transparent);
}
.player-more{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* Selected player area */
.selected-player{
  border-width:1.5px;
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--blue) 70%,transparent);
}
.selected-stats .stat{
  min-height:66px;
}

/* Quick preview */
.quick{
  border-color:color-mix(in srgb,var(--line2) 68%,var(--line));
}
.quick-card{
  transition:transform .15s ease,border-color .15s ease;
}
.quick-card:hover{
  transform:translateY(-2px);
}

/* Team cards */
.team-card{
  border-color:color-mix(in srgb,var(--line2) 68%,var(--line));
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}
.team-card.expanded{
  border-color:color-mix(in srgb,var(--blue) 38%,var(--line));
}
.team-top{
  background:linear-gradient(
    90deg,
    color-mix(in srgb,var(--surface2) 94%,var(--blue) 6%),
    var(--surface2)
  );
}
.team-name{
  letter-spacing:.01em;
}
.team-mini-stat{
  min-height:54px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.team-mini-stat strong{
  font-variant-numeric:tabular-nums;
}
.team-collapse-btn{
  min-width:90px;
}
.team-card.expanded .team-collapse-btn{
  background:color-mix(in srgb,var(--blue) 9%,var(--surface));
  border-color:color-mix(in srgb,var(--blue) 34%,var(--line));
}

/* Results */
.result-card{
  border-width:1.5px;
}
.result-summary{
  gap:9px;
}
.result-box{
  min-height:78px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.result-box strong{
  font-variant-numeric:tabular-nums;
}
.save-result{
  min-width:110px;
  box-shadow:0 7px 16px color-mix(in srgb,var(--blue) 14%,transparent);
}

/* Roster */
.roster{
  gap:9px;
}
.slot{
  border-width:1.5px;
  transition:border-color .15s ease,background .15s ease;
}
.slot:hover{
  border-color:color-mix(in srgb,var(--blue) 34%,var(--line2));
}
.slot.filled{
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 3%,transparent);
}
.roster-batch-btn{
  min-height:40px;
  padding:8px 13px;
}

/* History */
.history-section{
  margin-top:16px;
  padding-top:14px;
}
.history-head{
  margin-bottom:9px;
}
.team-history-row{
  border-color:color-mix(in srgb,var(--line2) 58%,var(--line));
  background:linear-gradient(
    90deg,
    color-mix(in srgb,var(--surface2) 96%,var(--purple) 4%),
    var(--surface2)
  );
  transition:border-color .15s ease,transform .15s ease;
}
.team-history-row:hover{
  border-color:color-mix(in srgb,var(--purple) 34%,var(--line));
  transform:translateY(-1px);
}
.team-history-time{
  font-variant-numeric:tabular-nums;
}

/* Make destructive actions very obvious */
.history-delete-btn,
.team-actions [data-delete],
.existing-player-edit .delete-old,
.prof-row .prof-del{
  border:1px solid color-mix(in srgb,var(--red) 75%,#fff 10%)!important;
  background:var(--red)!important;
  color:#fff!important;
  box-shadow:0 5px 14px color-mix(in srgb,var(--red) 20%,transparent);
  font-weight:950!important;
}
.history-delete-btn:hover,
.team-actions [data-delete]:hover,
.existing-player-edit .delete-old:hover,
.prof-row .prof-del:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}
.history-delete-btn{
  min-width:78px;
  min-height:38px;
  font-size:12px;
}
.team-actions [data-delete]{
  min-width:70px;
}
.existing-player-edit .delete-old{
  width:auto!important;
  min-width:76px;
  padding:0 12px;
  font-size:11px!important;
}
.prof-row .prof-del{
  width:auto!important;
  min-width:70px;
  padding:0 10px;
  font-size:11px!important;
}

/* New-player row removal is destructive-ish but softer */
.new-player-row .remove-new{
  width:auto!important;
  min-width:76px;
  padding:0 11px;
  border-color:color-mix(in srgb,var(--red) 42%,var(--line))!important;
  background:color-mix(in srgb,var(--red) 10%,var(--surface2))!important;
  color:var(--red)!important;
  font-size:11px!important;
  font-weight:950;
}

/* Player management modal */
.player-add-zone{
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 4%,transparent);
}
.existing-player-card{
  border-color:color-mix(in srgb,var(--line2) 62%,var(--line));
}
.existing-player-summary{
  transition:background .15s ease;
}
.existing-player-card.open{
  border-color:color-mix(in srgb,var(--blue) 34%,var(--line));
}
.players-modal-footer{
  backdrop-filter:blur(10px);
}

/* Pickers */
.picker-player,
.batch-player{
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.picker-player:hover,
.batch-player:hover{
  transform:translateY(-1px);
}
.batch-player.selected{
  box-shadow:
    inset 4px 0 0 var(--blue),

}

/* Modal polish */
.modal{
  background:rgba(4,7,16,.76);
}
.modal-card{
  border-color:color-mix(in srgb,var(--line2) 72%,var(--line));
}
.modal-actions{
  padding-top:4px;
}
.confirm-danger{
  min-width:92px;

  box-shadow:0 7px 18px color-mix(in srgb,var(--red) 24%,transparent);
}

/* Inputs */
.input,.select,.search,.prof-filter,.picker-prof-filter,
.new-player-row > input,.existing-player-edit > input{
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
.input:focus,.select:focus,.search:focus,.prof-filter:focus,.picker-prof-filter:focus,
.new-player-row > input:focus,.existing-player-edit > input:focus{
  border-color:color-mix(in srgb,var(--blue) 65%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 10%,transparent);
}

<script type="module">
const SIZE=10;

let players=[],playerArchive={},dungeons=[],activeDungeonId="",professions=["未設定"];

let pickerProfessionFilter="";

const expandedTeamIds=new Set();

let editingRecordTeamId="";


function openDeleteConfirm({title="確認刪除",message="",detail="",confirmText="刪除",action=null}={}){
  pendingDeleteAction=typeof action==="function"?action:null;
  $("confirmDeleteTitle").textContent=title;
  $("confirmDeleteMessage").textContent=message;
  $("confirmDeleteOkBtn").textContent=confirmText;

  const detailEl=$("confirmDeleteDetail");
  if(detail){
    detailEl.hidden=false;
    detailEl.textContent=detail;
  }else{
    detailEl.hidden=true;
    detailEl.textContent="";
  }

  openModal("confirmDeleteModal");
}
function closeDeleteConfirm(){
  pendingDeleteAction=null;
  closeModal("confirmDeleteModal");
}
function parseTime(v){
  let s=String(v||"").trim().toLowerCase();
  if(!s)return 0;

  // Accept: 04:32 / 04:32.518 / 4分32秒 / 4m32s / 272秒
  s=s.replace(/\s+/g,"");

  const secondsOnly=s.match(/^(\d+(?:\.\d+)?)秒$/);
  if(secondsOnly)return Math.round(Number(secondsOnly[1])*1000);

  const chinese=s.match(/^(?:(\d+)時)?(?:(\d+)分)?(\d+(?:\.\d+)?)秒$/);
  if(chinese){
    const h=Number(chinese[1]||0),m=Number(chinese[2]||0),sec=Number(chinese[3]||0);
    if(sec>=60||m>=60)return 0;
    return Math.round((h*3600+m*60+sec)*1000);
  }

  const latin=s.match(/^(?:(\d+)h)?(?:(\d+)m)?(\d+(?:\.\d+)?)s$/);
  if(latin){
    const h=Number(latin[1]||0),m=Number(latin[2]||0),sec=Number(latin[3]||0);
    if(sec>=60||m>=60)return 0;
    return Math.round((h*3600+m*60+sec)*1000);
  }

  const p=s.split(":").map(x=>x.trim());
  let h=0,m=0,sec=0;
  if(p.length===2){
    m=Number(p[0]);sec=Number(p[1]);
  }else if(p.length===3){
    h=Number(p[0]);m=Number(p[1]);sec=Number(p[2]);
  }else{
    return 0;
  }
  if(!Number.isFinite(h)||!Number.isFinite(m)||!Number.isFinite(sec))return 0;
  if(h<0||m<0||sec<0||sec>=60||m>=60)return 0;
  return Math.round((h*3600+m*60+sec)*1000);
}
function fmtTime(ms){
  ms=Number(ms||0);if(!ms)return"—";
  const total=Math.floor(ms/1000),m=Math.floor(total/60),s=total%60,milli=ms%1000,h=Math.floor(m/60),mm=m%60;
  return h?`${h}:${String(mm).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(milli).padStart(3,"0")}`:`${String(mm).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(milli).padStart(3,"0")}`;
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800)}
function setSync(mode,text){const el=$("syncState");el.className=`sync-pill ${mode}`;el.textContent=text}
function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeModal(m.id)}));

function loadLocal(){
  try{
    const sp=JSON.parse(localStorage.getItem(SHARED_PLAYER_CACHE)||"null");
    if(sp){players=Array.isArray(sp.players)?sp.players:[];playerArchive=sp.archive&&typeof sp.archive==="object"?sp.archive:{}}
    const sc=JSON.parse(localStorage.getItem(SHARED_CYCLE_CACHE)||"null");
    if(sc){dungeons=Array.isArray(sc.dungeons)?sc.dungeons:[];activeDungeonId=sc.activeDungeonId||""}
    const sd=JSON.parse(localStorage.getItem(CACHE_PREFIX)||"null");
    if(sd){teams=Array.isArray(sd.teams)?sd.teams:[];records=Array.isArray(sd.records)?sd.records:[]}
    const pr=JSON.parse(localStorage.getItem(PROF_CACHE)||"null");
    if(Array.isArray(pr)&&pr.length)professions=[...new Set(["未設定",...pr.filter(Boolean)])];
    const lm=JSON.parse(localStorage.getItem(LIMIT_CACHE)||"{}");
    limit=Number(lm[String(SIZE)]??2);
  }catch(e){console.warn(e)}
  normalizeAllPlayers();
  if(!selectedDungeonId)selectedDungeonId=activeDungeonId||dungeons.at(-1)?.id||"";
}
function saveLocalSharedPlayers(){normalizeAllPlayers();localStorage.setItem(SHARED_PLAYER_CACHE,JSON.stringify({players,archive:playerArchive}))}
function saveLocalCycles(){localStorage.setItem(SHARED_CYCLE_CACHE,JSON.stringify({dungeons,activeDungeonId}))}
function saveLocalPage(){localStorage.setItem(CACHE_PREFIX,JSON.stringify({teams,records}))}
function saveLocalProf(){localStorage.setItem(PROF_CACHE,JSON.stringify(professions.filter(x=>x!=="未設定")))}
function saveLocalLimits(){
  let obj={};try{obj=JSON.parse(localStorage.getItem(LIMIT_CACHE)||"{}")||{}}catch(e){}
  obj[String(SIZE)]=Number(limit||0);localStorage.setItem(LIMIT_CACHE,JSON.stringify(obj));
}


function normalizeRoles(p){
  if(Array.isArray(p?.roles)&&p.roles.length){
    return [...new Set(p.roles.map(x=>String(x||"").trim()).filter(Boolean))];
  }
  if(p?.role&&String(p.role).trim()){
    return [String(p.role).trim()];
  }
  return ["未設定"];
}
function normalizePlayer(p){
  const roles=normalizeRoles(p);
  return{
    ...p,
    roles,
    role:roles[0]||"未設定"
  };
}
function playerRolesText(p){
  return normalizeRoles(p).join(" / ");
}
function playerHasProfession(p,role){
  if(!role)return true;
  return normalizeRoles(p).includes(role);
}
function normalizeAllPlayers(){
  players=players.map(normalizePlayer);
  Object.keys(playerArchive||{}).forEach(id=>{
    playerArchive[id]=normalizePlayer(playerArchive[id]);
  });
}
function renderProfessionFilter(){
  const current=selectedProfessionFilter;
  const available=new Set();
  players.forEach(p=>normalizeRoles(p).forEach(r=>{if(r&&r!=="未設定")available.add(r)}));
  professions.forEach(r=>{if(r&&r!=="未設定")available.add(r)});
  $("professionFilter").innerHTML=`<option value="">全部職業</option>`+
    [...available].sort((a,b)=>a.localeCompare(b,"zh-Hant")).map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("");
  if([...available].includes(current)){
    $("professionFilter").value=current;
  }else{
    selectedProfessionFilter="";
    $("professionFilter").value="";
  }
}
function professionFilterOptions(current=""){
  const available=new Set();
  players.forEach(p=>normalizeRoles(p).forEach(r=>{if(r&&r!=="未設定")available.add(r)}));
  professions.forEach(r=>{if(r&&r!=="未設定")available.add(r)});
  return `<option value="">全部職業</option>`+
    [...available].sort((a,b)=>a.localeCompare(b,"zh-Hant")).map(r=>`<option value="${esc(r)}"${r===current?" selected":""}>${esc(r)}</option>`).join("");
}
function refreshPickerProfessionFilters(){
  if($("pickerProfessionFilter"))$("pickerProfessionFilter").innerHTML=professionFilterOptions(pickerProfessionFilter);
  if($("batchProfessionFilter"))$("batchProfessionFilter").innerHTML=professionFilterOptions(batchProfessionFilter);
}

const currentDungeon=()=>dungeons.find(d=>d.id===selectedDungeonId);
const isReview=()=>!!selectedDungeonId&&!!activeDungeonId&&selectedDungeonId!==activeDungeonId;
const visibleTeams=()=>teams.filter(t=>t.dungeonId===selectedDungeonId);
const visibleRecords=()=>records.filter(r=>r.dungeonId===selectedDungeonId);
const getPlayer=id=>players.find(p=>p.id===id)||playerArchive[id]||null;
const teamHistory=t=>visibleRecords().filter(r=>r.teamId===t.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const teamBest=t=>teamHistory(t).slice().sort((a,b)=>Number(a.timeMs)-Number(b.timeMs))[0]||null;


function isOutsiderToken(v){
  return typeof v==="string"&&v.startsWith("external:");
}
function getOutsider(team,token){
  return team?.externalMembers?.[token]||null;
}
function slotPerson(team,value){
  if(!value)return null;
  if(isOutsiderToken(value)){
    const ext=getOutsider(team,value);
    return{id:value,name:ext?.name||"外人",role:"外人",external:true};
  }
  const p=getPlayer(value);
  return p?{...p,external:false}:null;
}
function rosterSnapshotFromTeam(team){
  return (team.members||[]).filter(Boolean).map(v=>{
    const p=slotPerson(team,v);

function memberDisplayNames(team){

function rosterMemberKey(team,value){
  if(!value)return"";
  if(isOutsiderToken(value)){
    const ext=getOutsider(team,value);
    return`external:${norm(ext?.name||"外人")}`;
  }
  return`player:${value}`;

function rosterSignature(team,members=team?.members||[]){
  const filled=Array.from({length:SIZE},(_,i)=>members?.[i]||null).filter(Boolean);
  if(filled.length!==SIZE)return"";
  return filled.map(v=>rosterMemberKey(team,v)).sort().join("|");

function findDuplicateRosterTeam(team){
  if(!team)return null;

  return visibleTeams().find(other=>
    other.id!==team.id &&
    rosterSignature(other)===signature
  )||null;
}

function toggleBatchPlayer(playerId){

  if(!t)return;
  const outsiderCount=(t.members||[]).filter(isOutsiderToken).length;
  const internalCapacity=Math.max(0,SIZE-outsiderCount);

  if(batchSelectedIds.has(playerId)){
    batchSelectedIds.delete(playerId);
  }else{
    if(batchSelectedIds.size>=internalCapacity){
      toast(`最多只能選 ${internalCapacity} 位幫內玩家；隊伍另有 ${outsiderCount} 個外人位置`);
      return;
    }
    batchSelectedIds.add(playerId);

function applyBatchPlayers(){
  const t=teams.find(x=>x.id===batchTeamId);
  if(!t)return;

  const existingMembers=Array.from({length:SIZE},(_,i)=>(t.members||[])[i]||null);
  const externalSlots=existingMembers
    .map((v,i)=>isOutsiderToken(v)?{index:i,value:v}:null)
    .filter(Boolean);

  const capacity=SIZE-externalSlots.length;
  const selected=[...batchSelectedIds];

  if(selected.length>capacity){
    alert(`目前有 ${externalSlots.length} 個外人位置，所以最多只能選 ${capacity} 位幫內玩家。`);
    return;
  }

  const next=Array(SIZE).fill(null);

  // Keep outsiders exactly where they currently are.
  externalSlots.forEach(x=>next[x.index]=x.value);

  // Preserve selected internal players in their old slots where possible.
  const remaining=new Set(selected);
  existingMembers.forEach((v,i)=>{
    if(!v||isOutsiderToken(v)||!remaining.has(v)||next[i])return;
    next[i]=v;
    remaining.delete(v);
  });

  // Fill remaining selected players into first empty positions.
  for(const pid of remaining){
    const empty=next.findIndex(v=>!v);
    if(empty<0)break;
    next[empty]=pid;
  }

  t.members=next;
  t.updatedAtMs=Date.now();
  t._sync="pending";
  expandedTeamIds.add(t.id);

  saveLocalPage();
  closeModal("batchPickerModal");
  renderAll();
  syncTeam(t);
  warnDuplicateRoster(t);
  toast(`已套用 ${selected.length} 位幫內玩家`);
}

  const typed=prompt("外人名稱（可留空，留空就顯示「外人」）：","");
  if(typed===null)return;
  const token=`external:${uid("guest")}`;

async function saveResult(teamId){
  const t=teams.find(x=>x.id===teamId);if(!t)return;
  const timeEl=document.querySelector(`[data-time="${CSS.escape(teamId)}"]`);
  const dateEl=document.querySelector(`[data-date="${CSS.escape(teamId)}"]`);
  const noteEl=document.querySelector(`[data-note="${CSS.escape(teamId)}"]`);

  const ms=parseTime(timeEl?.value||"");
  if(!ms){
    alert("請填寫通關時間。可用 4:32、04:32.518、4分32秒 或 4m32s。");
    timeEl?.focus();
    return;
  }

  const filled=(t.members||[]).filter(Boolean);
  if(filled.length!==SIZE){
    alert(`這是 ${SIZE} 人本，需要把 ${SIZE} 個位置填滿。位置可以是幫內玩家，也可以選「外人」。`);
    return;
  }

  const roster=rosterSnapshotFromTeam(t);
  if(roster.length!==SIZE){
    alert("隊伍成員資料有缺漏，請重新選擇該位置。");
    return;
  }

  // Only guild/shared-list players count toward leaderboard limits.
  const internal=roster.filter(m=>!m.external&&players.some(p=>p.id===m.id));
  const over=internal.filter(m=>{
    const other=visibleTeams().filter(x=>x.id!==t.id&&x.currentResult?.roster?.some(r=>r.id===m.id&&!r.external)).length;
    return limit>0&&other+1>limit;
  }).map(m=>m.name);

  if(over.length&&!confirm(`以下玩家會超過上榜限制：\n${over.join("、")}\n\n仍要儲存嗎？`))return;

  const rec={
    id:uid("rec"),
    dungeonId:t.dungeonId,
    teamId:t.id,
    teamName:t.name,
    size:SIZE,
    timeMs:ms,
    date:dateEl?.value||today(),
    note:noteEl?.value.trim()||"",
    roster,
    createdAtMs:Date.now(),
    _sync:"pending"
  };

  records.push(rec);
  t.currentResult={
    recordId:rec.id,
    timeMs:rec.timeMs,
    date:rec.date,
    note:rec.note,
    roster:rec.roster
  };
  t.updatedAtMs=Date.now();
  t._sync="pending";
  expandedTeamIds.add(t.id);

  saveLocalPage();
  renderAll();
  toast(`${t.name} 已新增一筆本副本通關紀錄`);
  syncRecord(rec);
  syncTeam(t);
}

async function deleteRecordConfirmed(teamId,recordId){
  const t=teams.find(x=>x.id===teamId);

  records=records.filter(x=>x.id!==recordId);

      .filter(x=>x.teamId===teamId&&x.dungeonId===t.dungeonId)

      );

    const latest=remaining[0]||null;

      recordId:latest.id,
      timeMs:latest.timeMs,
      date:latest.date,
      note:latest.note||"",
      roster:latest.roster||[]
    }:null;

function normalizeRoleSelection(values=[]){
  let roles=[...new Set((Array.isArray(values)?values:[]).map(x=>String(x||"").trim()).filter(Boolean))];
  if(!roles.length)return["未設定"];
  if(roles.length>1)roles=roles.filter(x=>x!=="未設定");
  return roles.length?roles:["未設定"];
}
function roleDropdown(selected=[],extraClass=""){
  const chosen=new Set(normalizeRoleSelection(selected));
  const list=[...new Set(["未設定",...professions])];
  chosen.forEach(r=>{if(r&&!list.includes(r))list.push(r)});

  const label=[...chosen].join("、")||"未設定";

  return`<details class="role-dropdown ${esc(extraClass)}" data-role-dropdown>
    <summary class="role-dropdown-summary">
      <span class="role-dropdown-value">${esc(label)}</span>
      <span class="role-dropdown-arrow">▾</span>
    </summary>
    <div class="role-dropdown-menu">
      
      ${list.map(r=>`<label class="role-dropdown-option">
        <input type="checkbox" value="${esc(r)}"${chosen.has(r)?" checked":""}>
        <span>${esc(r)}</span>
      </label>`).join("")}
    </div>
  </details>`;
}
function updateRoleDropdown(dropdown,changedInput=null){
  if(!dropdown)return;

  const boxes=[...dropdown.querySelectorAll('.role-dropdown-menu input[type="checkbox"]')];

  if(changedInput?.checked){
    if(changedInput.value==="未設定"){
      boxes.forEach(box=>{if(box!==changedInput)box.checked=false});
    }else{
      const unset=boxes.find(box=>box.value==="未設定");
      if(unset)unset.checked=false;
    }
  }

  let selected=boxes.filter(box=>box.checked).map(box=>box.value);
  selected=normalizeRoleSelection(selected);

  if(!boxes.some(box=>box.checked)){
    const unset=boxes.find(box=>box.value==="未設定");
    if(unset)unset.checked=true;
    selected=["未設定"];
  }

  const value=dropdown.querySelector(".role-dropdown-value");
  if(value)value.textContent=selected.join("、");
}
function closeOtherRoleDropdowns(except=null){
  document.querySelectorAll("details.role-dropdown[open]").forEach(d=>{
    if(d!==except)d.removeAttribute("open");
  });
}

function savePlayersFromEditor(){
  const next=[],seen=new Set();let dup="";

  // Existing players: only cards still present are retained.
  document.querySelectorAll("#playerEditor .existing-player-card").forEach(card=>{
    const name=card.querySelector(".pname").value.trim();
    if(!name)return;
    const k=norm(name);
    if(seen.has(k)){dup=name;return}
    seen.add(k);

    const roles=collectRoles(card);
    next.push({
      id:card.dataset.id||uid("p"),
      name,
      roles,
      role:roles[0]||"未設定",
      note:card.querySelector(".pnote").value.trim()
    });
  });

  // New players: blank rows are ignored.
  document.querySelectorAll("#newPlayerEditor .new-player-row").forEach(row=>{
    const name=row.querySelector(".pname").value.trim();
    if(!name)return;
    const k=norm(name);
    if(seen.has(k)){dup=name;return}
    seen.add(k);

    const roles=collectRoles(row);
    next.push({
      id:uid("p"),
      name,
      roles,
      role:roles[0]||"未設定",
      note:row.querySelector(".pnote").value.trim()
    });
  });

  if(dup){alert(`玩家名稱重複：${dup}`);return}

  players.forEach(p=>playerArchive[p.id]=normalizePlayer(p));
  next.forEach(p=>playerArchive[p.id]=normalizePlayer(p));
  players=next.map(normalizePlayer);

  saveLocalSharedPlayers();
  closeModal("playersModal");
  renderAll();
  syncSharedPlayers();
  toast("玩家名單已更新");
}

  else if(Array.isArray(legacy.players)||Array.isArray(legacy.speedPlayers)){players=(legacy.players||legacy.speedPlayers||[]).map(p=>normalizePlayer({id:p.id||uid("p"),name:p.name||"",role:p.role||"未設定",roles:p.roles,note:p.note||""}));players.forEach(p=>playerArchive[p.id]={...p});await setDoc(pRef,{players,archive:playerArchive,updatedAt:serverTimestamp()}).catch(()=>{})}

  const cfgRef=doc(db,"competition","shared_config"),cfg=await getDoc(cfgRef).catch(()=>null);if(cfg?.exists()&&Array.isArray(cfg.data().professions))professions=[...new Set(["未設定",...cfg.data().professions.filter(Boolean)])];
  const limRef=doc(db,"competition","speed_limits"),lim=await getDoc(limRef).catch(()=>null);if(lim?.exists())limit=Number(lim.data()?.[`limit${SIZE}`]??limit);
  saveLocalSharedPlayers();saveLocalCycles();saveLocalProf();saveLocalLimits();
  if(!selectedDungeonId||!dungeons.some(d=>d.id===selectedDungeonId))selectedDungeonId=activeDungeonId||dungeons.at(-1)?.id||"";

async function migrateOldPageIfNeeded(){
  const {db,doc,getDoc,setDoc,collection,getDocs,serverTimestamp}=fb;
  const teamCol=collection(db,"competition",`speed_${SIZE}`,"teams"),existing=await getDocs(teamCol).catch(()=>null);
  if(existing&&existing.size>0)return;
  const oldRef=doc(db,"competition",`speed_${SIZE}`),oldSnap=await getDoc(oldRef).catch(()=>null);
  if(!oldSnap?.exists())return;
  const old=oldSnap.data(),oldTeams=Array.isArray(old.teams)?old.teams.filter(t=>Number(t.size||SIZE)===SIZE):[],oldRecords=Array.isArray(old.records)?old.records.filter(r=>Number(r.size||SIZE)===SIZE):[];
  for(const t of oldTeams){
    const team={id:t.id||uid("team"),dungeonId:t.dungeonId||activeDungeonId,size:SIZE,name:t.name||`${SIZE}人固定隊`,note:t.note||"",members:Array.isArray(t.members)?t.members:[],externalMembers:t.externalMembers&&typeof t.externalMembers==="object"?t.externalMembers:{},currentResult:null,createdAt:Date.now(),updatedAtMs:Date.now()};
    const active=oldRecords.filter(r=>r.teamId===team.id&&r.status==="active").sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
    if(active)team.currentResult={recordId:active.id||"",timeMs:Number(active.timeMs||0),date:active.date||"",note:active.note||"",roster:Array.isArray(active.roster)?active.roster:[]};
    await setDoc(doc(db,"competition",`speed_${SIZE}`,"teams",team.id),{...team,updatedAt:serverTimestamp()}).catch(()=>{});
  }
  for(const r of oldRecords){
    if(!Number(r.timeMs||0))continue;
    const rec={id:r.id||uid("rec"),dungeonId:r.dungeonId||activeDungeonId,teamId:r.teamId||"",teamName:r.teamName||"固定隊伍",size:SIZE,timeMs:Number(r.timeMs||0),date:r.date||"",note:r.note||"",roster:Array.isArray(r.roster)?r.roster:[],createdAtMs:Date.now()};
    await setDoc(doc(db,"competition",`speed_${SIZE}`,"records",rec.id),{...rec,createdAt:serverTimestamp()}).catch(()=>{});
  }
}
function subscribeRemote(){
  const {db,doc,onSnapshot,collection}=fb;
  sharedUnsubs.forEach(fn=>{try{fn()}catch(e){}});sharedUnsubs=[];
  sharedUnsubs.push(onSnapshot(doc(db,"competition","speed_players"),s=>{if(!s.exists())return;const d=s.data();players=Array.isArray(d.players)?d.players:players;playerArchive=d.archive&&typeof d.archive==="object"?d.archive:playerArchive;normalizeAllPlayers();saveLocalSharedPlayers();renderAll()}));
  sharedUnsubs.push(onSnapshot(doc(db,"competition","speed_cycles"),s=>{if(!s.exists())return;const d=s.data();dungeons=Array.isArray(d.dungeons)?d.dungeons:dungeons;activeDungeonId=d.activeDungeonId||activeDungeonId;if(!selectedDungeonId||!dungeons.some(x=>x.id===selectedDungeonId))selectedDungeonId=activeDungeonId||dungeons.at(-1)?.id||"";saveLocalCycles();renderAll()}));
  sharedUnsubs.push(onSnapshot(doc(db,"competition","shared_config"),s=>{if(s.exists()&&Array.isArray(s.data().professions)){professions=[...new Set(["未設定",...s.data().professions.filter(Boolean)])];saveLocalProf()}}));
  sharedUnsubs.push(onSnapshot(doc(db,"competition","speed_limits"),s=>{if(s.exists()){limit=Number(s.data()?.[`limit${SIZE}`]??limit);saveLocalLimits();renderAll()}}));

  teamUnsub?.();recordUnsub?.();
  teamUnsub=onSnapshot(collection(db,"competition",`speed_${SIZE}`,"teams"),snap=>{
    const remote=new Map();
    snap.forEach(ds=>remote.set(ds.id,{id:ds.id,...ds.data(),_sync:"synced"}));

    const localById=new Map(teams.map(t=>[t.id,t]));
    const merged=[];

    for(const [id,r] of remote){
      const l=localById.get(id);
      if(l&&(l._sync==="pending"||l._sync==="local")){
        merged.push(l);
      }else{
        merged.push(r);
      }
      localById.delete(id);
    }

    for(const l of localById.values()){
      if(l._sync==="pending"||l._sync==="local")merged.push(l);
    }

    teams=merged;
    saveLocalPage();renderAll();
  },e=>{console.warn(e);setSync("local","本機模式")});
  recordUnsub=onSnapshot(collection(db,"competition",`speed_${SIZE}`,"records"),snap=>{
    const remote=new Map();
    snap.forEach(ds=>remote.set(ds.id,{id:ds.id,...ds.data(),_sync:"synced"}));
    const localById=new Map(records.map(r=>[r.id,r]));
    const merged=[];
    for(const [id,r] of remote){
      const l=localById.get(id);
      merged.push(l&&(l._sync==="pending"||l._sync==="local")?l:r);
      localById.delete(id);
    }
    for(const l of localById.values()){
      if(l._sync==="pending"||l._sync==="local")merged.push(l);
    }
    records=merged;
    saveLocalPage();renderAll();
  },e=>console.warn(e));
}
async function syncTeam(team){
  saveLocalPage();if(!fbOnline||!fb){team._sync="local";saveLocalPage();renderAll();return}
  team._sync="pending";saveLocalPage();renderAll();setSync("saving","同步中");
  try{
    const clean={id:team.id,dungeonId:team.dungeonId,size:SIZE,name:team.name,note:team.note||"",members:Array.isArray(team.members)?team.members:[],externalMembers:team.externalMembers&&typeof team.externalMembers==="object"?team.externalMembers:{},currentResult:team.currentResult||null,createdAt:team.createdAt||Date.now(),updatedAtMs:Date.now()};
    await fb.setDoc(fb.doc(fb.db,"competition",`speed_${SIZE}`,"teams",team.id),{...clean,updatedAt:fb.serverTimestamp()});
    team._sync="synced";saveLocalPage();setSync("ok","已同步");renderAll();
  }catch(e){console.warn(e);team._sync="local";saveLocalPage();setSync("local","本機暫存");renderAll()}
}
async function syncRecord(rec){
  saveLocalPage();if(!fbOnline||!fb){rec._sync="local";saveLocalPage();return}
  try{
    const clean={id:rec.id,dungeonId:rec.dungeonId,teamId:rec.teamId,teamName:rec.teamName,size:SIZE,timeMs:rec.timeMs,date:rec.date,note:rec.note||"",roster:rec.roster||[],createdAtMs:rec.createdAtMs||Date.now()};
    await fb.setDoc(fb.doc(fb.db,"competition",`speed_${SIZE}`,"records",rec.id),{...clean,createdAt:fb.serverTimestamp()});
    rec._sync="synced";saveLocalPage();
  }catch(e){console.warn(e);rec._sync="local";saveLocalPage()}
}

async function deleteRecordRemote(recordId){

  setSync("saving","刪除同步中");
  try{
    await fb.deleteDoc(
      fb.doc(fb.db,"competition",`speed_${SIZE}`,"records",recordId)
    );
    setSync("ok","已同步");
  }catch(e){
    console.warn("Delete record sync failed",e);
    setSync("local","刪除未同步");
    alert("本機已刪除，但 Firebase 尚未同步。請檢查網路。");
  }
}
async function deleteTeamAndRecordsRemote(teamId,recordIds=[]){
  if(!fbOnline||!fb)return;

  setSync("saving","刪除同步中");

  try{
    const jobs=[
      fb.deleteDoc(
        fb.doc(fb.db,"competition",`speed_${SIZE}`,"teams",teamId)
      )
    ];

    for(const recordId of recordIds){
      if(!recordId)continue;
      jobs.push(
        fb.deleteDoc(
          fb.doc(fb.db,"competition",`speed_${SIZE}`,"records",recordId)
        )
      );
    }

    await Promise.all(jobs);
    setSync("ok","已同步");
  }catch(e){
    console.warn("Delete team/history sync failed",e);
    setSync("local","刪除未完全同步");
    alert("本機已刪除，但 Firebase 有部分資料未成功刪除。請檢查網路後再重新整理確認。");
  }
}

async function syncCycles(){if(!fbOnline||!fb)return;try{await fb.setDoc(fb.doc(fb.db,"competition","speed_cycles"),{dungeons,activeDungeonId,updatedAt:fb.serverTimestamp()})}catch(e){console.warn(e)}}

async function syncLimits(){if(!fbOnline||!fb)return;try{await fb.setDoc(fb.doc(fb.db,"competition","speed_limits"),{[`limit${SIZE}`]:Number(limit||0),updatedAt:fb.serverTimestamp()},{merge:true})}catch(e){console.warn(e)}}
