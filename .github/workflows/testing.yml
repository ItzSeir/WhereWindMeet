name: Discord Scheduler Testing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Testing announcement mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly

jobs:
  test-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Firebase Admin
        run: npm install firebase-admin@latest

      - name: Show test information
        run: |
          echo "=============================="
          echo "Cloudflare Scheduler Test"
          echo "=============================="
          echo "UTC:"
          date -u
          echo ""
          echo "Malaysia:"
          TZ=Asia/Kuala_Lumpur date
          echo ""
          echo "Mode: ${{ github.event.inputs.mode }}"

      - name: Send Discord test announcement
        run: node .github/scripts/post-discord.js
        env:
          RUN_MODE: ${{ github.event.inputs.mode }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
