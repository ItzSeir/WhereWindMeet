<style>

.brand-group{display:flex;gap:8px}.brand-badge{padding:7px 11px;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;font-size:11px;font-weight:900}.brand-badge.sub{background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.nav-wrap,.nav{display:flex;align-items:center;gap:5px}.nav a{padding:8px 10px;border-radius:999px;color:var(--muted);font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap}.nav a.active,.nav a:hover{background:var(--surface2);color:var(--text)}
.theme-toggle{min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--text);font-size:10px;font-weight:900}
.page{width:min(1450px,calc(100% - 32px));margin:0 auto;padding:102px 0 42px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}.kicker{font-size:10px;font-weight:900;letter-spacing:.13em;color:var(--orange)}h1{margin:4px 0 6px;font-size:27px}.subtitle{margin:0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{min-height:38px;padding:8px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);font-size:10px;font-weight:900}.btn.primary{border-color:transparent;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.week-main{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.week-label{color:var(--muted);font-size:9px;font-weight:900}.week-select{min-width:260px;height:39px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font-size:11px;font-weight:850}.state-pill{padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:8.5px;font-weight:900}.state-pill.current{color:var(--green)}.state-pill.review{color:var(--orange)}
.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px;align-items:start}
.player-panel,.board{border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.player-panel{position:sticky;top:96px;overflow:hidden}.player-head{padding:14px;border-bottom:1px solid var(--line)}.player-title-row{display:flex;align-items:center;justify-content:space-between}.player-head h2{margin:0;font-size:17px}.player-count{color:var(--muted);font-size:9px;font-weight:900}.search{width:100%;height:42px;margin-top:9px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font-size:10px}.player-list{display:grid;gap:6px;padding:8px;max-height:calc(100vh - 280px);overflow:auto}.player{min-height:58px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:grab}.player:hover{background:var(--surface3);border-color:var(--line2)}.player strong{display:block;font-size:12px}.player span{display:block;margin-top:2px;color:var(--muted);font-size:8.5px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:10px}
.board{padding:14px}.review-note{margin-bottom:10px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--orange) 35%,var(--line));border-radius:9px;background:color-mix(in srgb,var(--orange) 7%,var(--surface2));color:var(--muted);font-size:9px}.review-note strong{color:var(--orange)}
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px}.day-card{border:1px solid var(--line);border-radius:15px;background:var(--surface2);overflow:hidden}.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.day-name{font-size:15px;font-weight:950}.day-meta{margin-top:3px;color:var(--muted);font-size:9px}.day-actions button{min-height:29px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text);font-size:8px;font-weight:900}
.day-body{padding:10px}.side-title{display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px;color:var(--muted);font-size:9px;font-weight:900}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:10px}.slot{position:relative;min-height:55px;padding:7px;border:1px dashed var(--line2);border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center}.slot.filled{border-style:solid;background:var(--surface3)}.slot.over{outline:2px solid color-mix(in srgb,var(--orange) 55%,transparent)}.slot-no{position:absolute;top:3px;left:5px;color:var(--soft);font-size:7px;font-weight:900}.slot strong{font-size:9px}.slot span{display:block;margin-top:2px;color:var(--muted);font-size:7.5px}.remove{position:absolute;top:2px;right:3px;border:0;background:none;color:var(--soft);font-size:9px}
.modal{position:fixed;z-index:9000;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,7,16,.72);backdrop-filter:blur(12px)}.modal.show{display:flex}.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;padding:18px;border:1px solid var(--line2);border-radius:17px;background:var(--surface);box-shadow:0 30px 90px rgba(0,0,0,.42)}.modal-title{margin:0;font-size:18px}.modal-sub{margin:5px 0 13px;color:var(--muted);font-size:10px;line-height:1.6}.editor{display:grid;gap:6px}.edit-row{display:grid;grid-template-columns:minmax(130px,1fr) 100px minmax(160px,1fr) auto;gap:6px}.edit-row input,.edit-row select{height:36px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--text);font-size:10px}.edit-row button{width:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--red)}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}
.toast{position:fixed;z-index:10000;left:50%;bottom:24px;transform:translate(-50%,20px);padding:8px 12px;border-radius:999px;background:#111827;color:#fff;font-size:9px;font-weight:900;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.workspace{grid-template-columns:270px minmax(0,1fr)}.days{grid-template-columns:1fr}.slots{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:760px){.topbar{top:10px;border-radius:20px}.topbar-content{align-items:flex-start;flex-direction:column}.nav-wrap{width:100%;overflow:hidden}.nav{overflow-x:auto}.page{padding-top:135px;width:calc(100% - 20px)}.page-head{align-items:flex-start;flex-direction:column}.workspace{grid-template-columns:1fr}.player-panel{position:relative;top:auto}.player-list{max-height:340px}.days{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.weekbar{align-items:flex-start;flex-direction:column}.week-select{width:100%;min-width:0}.edit-row{grid-template-columns:1fr 90px}.edit-row .note{grid-column:1/-1}}

const firebaseConfig={apiKey:"AIzaSyACN_995akAtlrJcdUx3opXMELAp5NtHEk",authDomain:"wwm-competition.firebaseapp.com",projectId:"wwm-competition",storageBucket:"wwm-competition.firebasestorage.app",messagingSenderId:"608687294114",appId:"1:608687294114:web:d7d3ac463cfdaac19cb9fb"};
let initializeApp=null,getFirestore=null,doc=null,getDoc=null,onSnapshot=null,setDoc=null,serverTimestamp=null;
let app=null,db=null,WAR_REF=null,LEGACY_REF=null,SHARED_CONFIG_REF=null;

const $=id=>document.getElementById(id),uid=p=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`,esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),norm=s=>String(s??"").trim().toLowerCase(),rosterIds=a=>(Array.isArray(a)?a:[]).filter(Boolean);
const localDateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseLocalDate=s=>{
  const [y,m,d]=String(s||"").split("-").map(Number);

};

function currentWeek(){
  const d=new Date();

  const day=d.getDay();
  const delta=day===0?-1:6-day;
  d.setDate(d.getDate()+delta);
  return localDateKey(d);
}
function emptyDay(name){return{name,defense:Array(15).fill(null),offense:Array(15).fill(null)}}
function ensureWeek(w,key){return{saturday:{...emptyDay("週六百業戰"),...(w?.saturday||{})},sunday:{...emptyDay("週日百業戰"),...(w?.sunday||{})},key}}
function normalizeWeekKey(key){
  if(!key)return key;
  const d=parseLocalDate(key);
  /* Earlier builds converted local midnight to UTC and saved Friday
     instead of the intended Saturday. Repair exactly that case. */
  if(d.getDay()===5){
    d.setDate(d.getDate()+1);
    return localDateKey(d);
  }
  return key;
}
function dayFilledCount(day){
  return rosterIds(day?.defense).length+rosterIds(day?.offense).length;
}
function mergeWeekData(a,b,key){
  const A=ensureWeek(a,key),B=ensureWeek(b,key);
  return{
    key,
    saturday:dayFilledCount(B.saturday)>dayFilledCount(A.saturday)?B.saturday:A.saturday,
    sunday:dayFilledCount(B.sunday)>dayFilledCount(A.sunday)?B.sunday:A.sunday
  };
}
function normalizeWeekMap(rawWeeks){
  const out={};
  Object.entries(rawWeeks&&typeof rawWeeks==="object"?rawWeeks:{}).forEach(([key,value])=>{
    const fixed=normalizeWeekKey(key);
    if(!fixed)return;
    out[fixed]=out[fixed]?mergeWeekData(out[fixed],value,fixed):ensureWeek(value,fixed);
  });
  return out;
}
function normalizeRoles(p){
  if(Array.isArray(p?.roles)&&p.roles.length)return [...new Set(p.roles.map(x=>String(x||"").trim()).filter(Boolean))];
  if(p?.role&&String(p.role).trim())return[String(p.role).trim()];

}

function normalizeWar(raw){
  const s={version:1,players:[],playerArchive:{},weeks:{}};
  if(!raw||typeof raw!=="object")return s;
  const legacy=Array.isArray(raw.warPlayers)?raw.warPlayers:Array.isArray(raw.players)?raw.players:[];
  s.players=(Array.isArray(raw.players)&&raw.version===1?raw.players:legacy).map(normalizePlayer);
  s.playerArchive=raw.playerArchive&&typeof raw.playerArchive==="object"?{...raw.playerArchive}:{};
  s.players.forEach(p=>s.playerArchive[p.id]=snap(p));
  s.weeks=normalizeWeekMap(raw.weeks&&typeof raw.weeks==="object"?raw.weeks:(raw.warWeeks&&typeof raw.warWeeks==="object"?raw.warWeeks:{}));
  const k=currentWeek();s.weeks[k]=ensureWeek(s.weeks[k],k);return s
}
let state={version:1,players:[],playerArchive:{},weeks:{}},selectedWeek=currentWeek();
let professionList=["未設定"];

  const chosen=new Set(normalizeRoleSelection(selected));
  const list=[...new Set(["未設定",...professionList])];

        <span>${esc(r)}</span>
      </label>`).join("")}
    </div>
  </details>`;
}
function updateRoleDropdown(dropdown,changedInput=null){
  if(!dropdown)return;
  const boxes=[...dropdown.querySelectorAll('input[type="checkbox"]')];
  if(changedInput?.checked){
    if(changedInput.value==="未設定")boxes.forEach(b=>{if(b!==changedInput)b.checked=false});
    else{const unset=boxes.find(b=>b.value==="未設定");if(unset)unset.checked=false}
  }
  let selected=normalizeRoleSelection(boxes.filter(b=>b.checked).map(b=>b.value));
  if(!boxes.some(b=>b.checked)){
    const unset=boxes.find(b=>b.value==="未設定");if(unset)unset.checked=true;
    selected=["未設定"];
  }
  const out=dropdown.querySelector(".role-dropdown-value");if(out)out.textContent=selected.join("、");

}

function renderDay(dayKey,label,date,obj){
  const d=ensureWeek({[dayKey]:obj},selectedWeek)[dayKey],def=rosterIds(d.defense).length,off=rosterIds(d.offense).length;
  return`<article class="day-card"><div class="day-head"><div><div class="day-name">${esc(d.name||label+"百業戰")}</div><div class="day-meta">${fmt(date)} ${label} · 20:30 · 防守 ${def}/15 · 進攻 ${off}/15</div></div><div class="day-actions">${!isReview()?`<button data-rename="${dayKey}">改名</button>`:""}</div></div><div class="day-body"><div class="side-title"><span>防守</span><span>${def}/15</span></div><div class="slots">${Array.from({length:15},(_,i)=>slot(dayKey,"defense",i,(d.defense||[])[i])).join("")}</div><div class="side-title"><span>進攻</span><span>${off}/15</span></div><div class="slots">${Array.from({length:15},(_,i)=>slot(dayKey,"offense",i,(d.offense||[])[i])).join("")}</div></div></article>`
}
function renderDays(){
  state.weeks[selectedWeek]=ensureWeek(state.weeks[selectedWeek],selectedWeek);
  const w=state.weeks[selectedWeek];
  $("days").innerHTML=
    renderDay("saturday","週六",selectedWeek,w.saturday)+
    renderDay("sunday","週日",addDays(selectedWeek,1),w.sunday);

  if(isReview())return;

  document.querySelectorAll(".slot").forEach(s=>{
    s.ondragover=e=>{e.preventDefault();s.classList.add("over")};
    s.ondragleave=()=>s.classList.remove("over");
    s.ondrop=e=>{
      e.preventDefault();
      s.classList.remove("over");
      const pid=e.dataTransfer.getData("text/player");
      if(pid)assign(s.dataset.day,s.dataset.section,Number(s.dataset.index),pid);
    };
    s.onclick=e=>{
      if(e.target.closest("[data-remove]"))return;
      openSlotPicker(s.dataset.day,s.dataset.section,Number(s.dataset.index));
    };
  });

  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const s=b.closest(".slot");
    requestRemove(s.dataset.day,s.dataset.section,b.dataset.remove);
  });

function renderAll(){renderWeeks();renderPlayers();renderDays()}
function assign(day,section,index,pid){
  const w=state.weeks[selectedWeek]=ensureWeek(state.weeks[selectedWeek],selectedWeek);
  const d=w[day],p=state.players.find(x=>x.id===pid);
  if(!p)return;

  const occupant=(d[section]||[])[index]||null;
  const all=[...rosterIds(d.defense),...rosterIds(d.offense)].filter(id=>id!==occupant);
  if(all.includes(pid)){toast(`${p.name} 已在這一天編成`);return}

  d[section]=Array.from({length:15},(_,i)=>(d[section]||[])[i]||null);
  d[section][index]=pid;
  state.playerArchive[p.id]=snap(p);
  persist();
  renderAll();
}
function requestRemove(day,section,pid){
  const p=getPlayer(pid);
  openConfirm({
    title:"移除編成",
    message:`確定要移除「${p?.name||"這位玩家"}」？`,
    confirmText:"移除",
    action:()=>remove(day,section,pid)
  });
}
function remove(day,section,pid){
  const d=state.weeks[selectedWeek]?.[day];
  if(!d)return;
  d[section]=(d[section]||[]).map(x=>x===pid?null:x);
  persist();
  renderAll();
}

  $("slotPickerTitle").textContent=`${slotPickerDay==="saturday"?"週六":"週日"} · ${slotPickerSection==="defense"?"防守":"進攻"} · 第 ${slotPickerIndex+1} 位`;
  $("slotPickerList").innerHTML=state.players
    .filter(p=>
      !used.has(p.id) &&
      (!q||norm(`${p.name} ${playerRolesText(p)} ${p.note}`).includes(q)) &&

}
function renameDay(day){const d=state.weeks[selectedWeek]?.[day];if(!d)return;const v=prompt("編成板名稱：",d.name||"");if(v===null||!v.trim())return;d.name=v.trim();persist();renderAll()}
$("weekSelect").onchange=()=>{selectedWeek=$("weekSelect").value;renderAll()};$("backWeekBtn").onclick=()=>{selectedWeek=currentWeek();renderAll()};$("search").oninput=renderPlayers;

        }

function renderPlayerEditor(){

  const next=[],names=new Set();let dup="";

  document.querySelectorAll("#editor .existing-player-card").forEach(card=>{
    const name=card.querySelector(".name").value.trim();if(!name)return;
    const k=norm(name);if(names.has(k)){dup=name;return}names.add(k);
    const roles=collectRoles(card);

  });

  document.querySelectorAll("#newPlayerEditor .new-player-row").forEach(row=>{
    const name=row.querySelector(".name").value.trim();if(!name)return;
    const k=norm(name);if(names.has(k)){dup=name;return}names.add(k);
    const roles=collectRoles(row);

  });
