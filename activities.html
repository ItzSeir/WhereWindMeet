      3. 若圖片還沒準備好，可先留空字串，頁面會顯示漂亮的替代封面
      4. 新增活動時複製一整個 { ... }，id 不可重複
    */
    const EVENTS = [
      {
        id:"fitness-party-2026", title:"夢回・全民跳操同樂會", date:"2026-09-17", category:"遊戲活動",
        cover:"assets/events/fitness-party/cover.jpg", icon:"🏃", attendees:"全體成員",
        description:"副本打累了，爬塔爬累了嗎？這次不比輸出、不看戰力，大家一起跟著節奏動一動，在輕鬆的笑聲中留下新的回憶。",
        photos:["assets/events/fitness-party/01.jpg","assets/events/fitness-party/02.jpg","assets/events/fitness-party/03.jpg"]
      },
      {
        id:"new-year-2026", title:"2025再見，2026你好", date:"2026-01-01", category:"節慶活動",
        cover:"assets/events/new-year-2026/cover.jpg", icon:"🎆", attendees:"夢回家族",
        description:"大家第一次一起跨年。倒數、煙火與合照，把新一年的第一份快樂留給彼此，也期待未來還有更多值得紀念的夜晚。",
        photos:["assets/events/new-year-2026/01.jpg","assets/events/new-year-2026/02.jpg","assets/events/new-year-2026/03.jpg","assets/events/new-year-2026/04.jpg"]
      },
      {
        id:"christmas-2025", title:"叮叮噹・染衣節", date:"2025-12-24", category:"節慶活動",
        cover:"assets/events/christmas-2025/cover.jpg", icon:"🎄", attendees:"夢回小夥伴",
        description:"歲末將至，鈴聲入夜。大家換上聖誕配色，一起拍攝第一年的聖誕大合照，為這個冬天添上一點溫暖。",
        photos:["assets/events/christmas-2025/01.jpg","assets/events/christmas-2025/02.jpg"]
      }
      ];

    const $ = (s, root=document) => root.querySelector(s);
    const grid=$("#eventGrid"), filters=$("#filters"), search=$("#searchInput"), sort=$("#sortSelect");
    const modal=$("#eventModal"), modalBody=$("#modalBody"), lightbox=$("#lightbox");
    let activeCategory="全部", lightboxPhotos=[], lightboxIndex=0;
    const categories=["全部",...new Set(EVENTS.map(event=>event.category))];
    const dateText=value=>new Intl.DateTimeFormat("zh-Hant",{year:"numeric",month:"long",day:"numeric"}).format(new Date(value+"T00:00:00"));
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));

    function imageMarkup(src,alt,icon,extraClass=""){
      return `<span class="cover-fallback ${extraClass}">${escapeHtml(icon||"✦")}</span>${src?`<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" onerror="this.style.display='none'">`:""}`;
    }
    function renderFilters(){filters.innerHTML=categories.map(item=>`<button class="filter-btn ${item===activeCategory?"active":""}" type="button" data-category="${escapeHtml(item)}">${escapeHtml(item)}</button>`).join("")}
    function filteredEvents(){
      const keyword=search.value.trim().toLowerCase();
      const result=EVENTS.filter(event=>(activeCategory==="全部"||event.category===activeCategory)&&(!keyword||[event.title,event.description,event.category].join(" ").toLowerCase().includes(keyword)));
      return result.sort((a,b)=>sort.value==="photos"?b.photos.length-a.photos.length:sort.value==="oldest"?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
    }
    function render(){
      const events=filteredEvents();
      grid.innerHTML=events.map(event=>`<article class="event-card" tabindex="0" role="button" data-id="${event.id}" aria-label="查看 ${escapeHtml(event.title)}">
        <div class="cover">${imageMarkup(event.cover,event.title,event.icon)}<div class="cover-top"><span class="badge">${escapeHtml(event.category)}</span><span class="badge photo-count">▧ ${event.photos.length}</span></div></div>
        <div class="card-body"><span class="event-date">${dateText(event.date)}</span><h3>${escapeHtml(event.title)}</h3><p>${escapeHtml(event.description)}</p><div class="card-bottom"><span class="attendees">♟ ${escapeHtml(event.attendees)}</span><span class="view-link">查看回憶 →</span></div></div>
      </article>`).join("");
      $("#resultCount").textContent=`顯示 ${events.length} 場活動`;
      $("#emptyState").classList.toggle("show",events.length===0);grid.style.display=events.length?"grid":"none";
    }
    function openEvent(id){
      const event=EVENTS.find(item=>item.id===id);if(!event)return;
      modalBody.innerHTML=`<div class="modal-hero">${imageMarkup(event.cover,event.title,event.icon)}<div class="modal-gradient"></div><div class="modal-title"><small>${dateText(event.date)} · ${escapeHtml(event.category)}</small><h2 id="modalHeading">${escapeHtml(event.title)}</h2></div></div>
        <div class="modal-content"><div class="modal-meta"><span class="meta-pill">🗓 ${dateText(event.date)}</span><span class="meta-pill">♟ ${escapeHtml(event.attendees)}</span><span class="meta-pill">📷 ${event.photos.length} 張照片</span></div><p class="modal-description">${escapeHtml(event.description)}</p><div class="gallery-head"><h3>活動照片</h3><span class="gallery-tip">點擊照片可放大查看</span></div><div class="photo-grid">${event.photos.length?event.photos.map((src,index)=>`<button class="photo-item" type="button" data-photo-index="${index}" aria-label="查看第 ${index+1} 張照片"><span class="photo-placeholder">照片 ${index+1}</span><img src="${escapeHtml(src)}" alt="${escapeHtml(event.title)} 活動照片 ${index+1}" loading="lazy" onerror="this.style.display='none'"></button>`).join(""):`<div class="empty show" style="grid-column:1/-1"><strong>照片整理中</strong><span>將圖片放進活動資料夾，再把路徑填入 photos 即會顯示。</span></div>`}</div></div>`;
      lightboxPhotos=event.photos;modal.classList.add("show");document.body.style.overflow="hidden";$(".modal-panel",modal).scrollTop=0;$("#modalClose").focus();
    }
    function closeModal(){modal.classList.remove("show");document.body.style.overflow=""}
    function showPhoto(index){if(!lightboxPhotos.length)return;lightboxIndex=(index+lightboxPhotos.length)%lightboxPhotos.length;$("#lightboxImage").src=lightboxPhotos[lightboxIndex];$("#lightboxCaption").textContent=`${lightboxIndex+1} / ${lightboxPhotos.length}`;lightbox.classList.add("show")}
    function closeLightbox(){lightbox.classList.remove("show");$("#lightboxImage").removeAttribute("src")}

    filters.addEventListener("click",event=>{const btn=event.target.closest("[data-category]");if(!btn)return;activeCategory=btn.dataset.category;renderFilters();render()});
    grid.addEventListener("click",event=>{const card=event.target.closest("[data-id]");if(card)openEvent(card.dataset.id)});
    grid.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&event.target.matches("[data-id]")){event.preventDefault();openEvent(event.target.dataset.id)}});
    search.addEventListener("input",render);sort.addEventListener("change",render);
    modal.addEventListener("click",event=>{if(event.target===modal)closeModal();const photo=event.target.closest("[data-photo-index]");if(photo)showPhoto(Number(photo.dataset.photoIndex))});
    $("#modalClose").addEventListener("click",closeModal);$("#lightboxClose").addEventListener("click",closeLightbox);$("#lightboxPrev").addEventListener("click",()=>showPhoto(lightboxIndex-1));$("#lightboxNext").addEventListener("click",()=>showPhoto(lightboxIndex+1));
    lightbox.addEventListener("click",event=>{if(event.target===lightbox)closeLightbox()});
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(lightbox.classList.contains("show"))closeLightbox();else if(modal.classList.contains("show"))closeModal()}if(lightbox.classList.contains("show")&&event.key==="ArrowLeft")showPhoto(lightboxIndex-1);if(lightbox.classList.contains("show")&&event.key==="ArrowRight")showPhoto(lightboxIndex+1)});
    const themeToggle=$("#themeToggleBtn");
    function setTheme(theme){
      document.documentElement.dataset.theme=theme;
      localStorage.setItem("registration_theme",theme);
      localStorage.setItem("wwm-home-theme-v2",theme);
      themeToggle.textContent=theme==="light"?"☾ 夜間":"☀ 白天";
      document.querySelector('meta[name="theme-color"]').content=theme==="light"?"#eef3fb":"#0b1020";
    }
    themeToggle.addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="light"?"dark":"light"));
    setTheme(localStorage.getItem("registration_theme")||localStorage.getItem("wwm-home-theme-v2")||"dark");
    const floatingNav=$("#floatingNav");
    addEventListener("scroll",()=>floatingNav.classList.toggle("scrolled",scrollY>18),{passive:true});
    $("#eventTotal").textContent=EVENTS.length;renderFilters();render();
  </script>
  <script>
    (async()=>{
      const box=document.getElementById("siteAnnouncement");
      if(!box)return;
      const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
      try{
        const response=await fetch("/WhereWindMeet/data/announcement.json?t="+Date.now());
        const data=await response.json();
        const items=data.enabled&&Array.isArray(data.announcements)?data.announcements:[];
        if(!items.length){box.remove();return}
        let current=0,timer;
        const show=index=>{
          current=(index+items.length)%items.length;
          const item=items[current];
          box.innerHTML=`<div class="announcementBar"><div class="announcementIcon">📢</div><div class="announcementContent"><div class="announcementTitle">${esc(item.title||"重要公告")}</div>${item.pill?`<div class="announcementPill">${esc(item.pill)}</div>`:""}<div class="announcementText">${esc(item.text||item.content||item.message||"")}</div><div class="announcementTime">更新時間：${esc(item.updated||"")}</div></div>${items.length>1?`<div class="announcementControls"><button class="announcementArrow" data-go="-1" type="button" aria-label="上一則">‹</button><button class="announcementArrow" data-go="1" type="button" aria-label="下一則">›</button></div><div class="announcementDots">${items.map((_,i)=>`<button class="announcementDot ${i===current?"active":""}" data-index="${i}" type="button" aria-label="第 ${i+1} 則公告"></button>`).join("")}</div>`:""}</div>`;
          box.querySelectorAll("[data-go]").forEach(btn=>btn.onclick=()=>manual(current+Number(btn.dataset.go)));
          box.querySelectorAll("[data-index]").forEach(btn=>btn.onclick=()=>manual(Number(btn.dataset.index)));
        };
        const start=()=>{clearInterval(timer);if(items.length>1)timer=setInterval(()=>show(current+1),5000)};
        const manual=index=>{show(index);start()};
        show(0);start();
      }catch(error){box.remove()}
    })();
  </script>
</body>
</html>
